<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}} · Orders</title>
<meta name="application-name" content="{{BRAND}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e4e1da;
    --accent: #b4441f; --ok: #2f7d4f; --ok-bg: #e6f3eb; --warn: #9a6a00; --warn-bg: #fbf1d9;
    --bad: #a3322a; --bad-bg: #f9e3e1; --neutral-bg: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #201f1c; --text: #ecebe7; --muted: #a29f97; --line: #34322e;
      --accent: #e0774f; --ok: #6cc591; --ok-bg: #1f3428; --warn: #e3b94f; --warn-bg: #3a3020;
      --bad: #ee8a80; --bad-bg: #3d2422; --neutral-bg: #2b2a26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 20px 24px 40px; max-width: 1200px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
          padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
  input[type=search] { flex: 1; min-width: 180px; max-width: 320px; padding: 6px 10px; border-radius: 8px;
                       border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  button.plain { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                 border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  select.plain { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                 border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; margin-bottom: 6px; }
  .orders { display: grid; gap: 10px; }
  .order { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
           display: grid; grid-template-columns: 90px 1fr auto; gap: 4px 16px; }
  .order.new { box-shadow: 0 0 0 2px var(--accent); }
  .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .when { color: var(--muted); font-size: 13px; }
  .who { font-weight: 600; }
  .phone { color: var(--muted); font-size: 13px; margin-left: 6px; }
  ul.items { margin: 6px 0 0; padding-left: 18px; }
  ul.items li { margin: 1px 0; }
  .right { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .total { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .empty, .msg { color: var(--muted); padding: 30px; text-align: center; background: var(--panel);
                 border: 1px dashed var(--line); border-radius: 10px; }
  .msg.err { color: var(--bad); }
  a { color: var(--accent); }
  .login { max-width: 380px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 22px; }
  .login input { width: 100%; padding: 8px 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--text); font: inherit; }
  .login button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 8px 12px;
         cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .call { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .call > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; padding: 12px 16px;
                   display: grid; grid-template-columns: 130px 1fr auto; gap: 4px 16px; align-items: center; }
  .call > button:focus-visible { outline: 2px solid var(--accent); border-radius: 10px; }
  .transcript { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 6px; }
  .line { display: grid; grid-template-columns: 70px 1fr; gap: 10px; font-size: 14px; }
  .line .role { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; padding-top: 2px; }
  .line.caller .text { font-weight: 600; }
  .line.tool .text, .line.event .text { color: var(--muted); font-size: 13px; font-family: ui-monospace, monospace;
                                        overflow-wrap: anywhere; }
  .line.event .text { font-family: inherit; font-style: italic; }
  @media (max-width: 640px) {
    .call > button { grid-template-columns: 1fr; }
    .line { grid-template-columns: 1fr; gap: 0; }
    header, main { padding-left: 16px; padding-right: 16px; }
    .order { grid-template-columns: 1fr; }
    .right { align-items: flex-start; text-align: left; }
    .badges { justify-content: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Orders</h1>
    <div class="sub" id="status">Loading…</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="plain" id="refresh">Refresh</button>
    <button class="plain" id="logout">Change token</button>
  </div>
</header>
<main id="app"></main>

<script>
  const BASE_TITLE = document.title;
(() => {
  const KEY = "orders_dashboard_token";
  const REFRESH_MS = 10000;
  const app = document.getElementById("app");
  const statusEl = document.getElementById("status");
  let filter = "all", query = "", orders = [], seen = null, timer = null;
  let view = "orders", calls = [], openCall = null;
  let businesses = [], businessId = "";  // "" = all businesses
  const RKEY = "orders_dashboard_business";
  try { businessId = localStorage.getItem(RKEY) || ""; } catch {}
  const businessName = id => (businesses.find(r => r.id === id) || {}).name || "";
  const transcripts = new Map();  // call_id -> events

  const store = {
    get() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };
  let token = store.get();

  const money = n => "$" + Number(n || 0).toFixed(2);
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  };
  const fmtPhone = p => {
    const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(p || "");
    return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (p || "");
  };
  const fmtTime = ts => {
    const d = new Date(ts * 1000), now = new Date();
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toDateString() === now.toDateString() ? time
      : d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
  };
  const isToday = ts => new Date(ts * 1000).toDateString() === new Date().toDateString();

  const STATUS = {
    confirmed: ["Confirmed", "ok"], awaiting_payment: ["Awaiting payment", "warn"], cancelled: ["Cancelled", "bad"],
  };
  const PAY = {
    paid: ["Paid", "ok"], unpaid: ["Unpaid", "warn"], expired: ["Link expired", "bad"],
    not_requested: ["Pay at pickup", ""],
  };
  // Sending the order to the business's point of sale (Square, Clover). No badge when none is connected.
  const POS = { held: ["To POS when paid", ""], sent: ["On POS", "ok"], pending: ["Sending to POS", ""], failed: ["Not on POS", "bad"] };
  const badge = ([label, cls]) => el("span", { class: "badge " + cls }, label);

  function showLogin(message) {
    clearInterval(timer);
    statusEl.textContent = "Sign in to view orders";
    const input = el("input", { type: "password", placeholder: "ADMIN_API_TOKEN", autocomplete: "off" });
    const go = () => { token = input.value.trim(); if (token) { store.set(token); start(); } };
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    app.replaceChildren(el("div", { class: "login" },
      el("strong", {}, "Orders dashboard"),
      el("div", { class: "sub" }, "Enter the ADMIN_API_TOKEN from the server's .env file."),
      message ? el("div", { class: "msg err", style: "padding:8px;margin-top:10px" }, message) : null,
      input, el("button", { onclick: go }, "View orders")));
    input.focus();
  }

  const api = path => fetch(path, { headers: { Authorization: "Bearer " + token } });

  async function loadTranscript(id) {
    const r = await api("calls/" + encodeURIComponent(id));
    if (r.ok) transcripts.set(id, (await r.json()).events);
  }

  async function load() {
    try {
      const scope = businessId ? "&business=" + encodeURIComponent(businessId) : "";
      const [r, rc, rr] = await Promise.all([api("orders?limit=200" + scope), api("calls?limit=200" + scope),
                                             api("businesses")]);
      if (r.status === 401) { store.clear(); return showLogin("That token didn't work."); }
      if (r.status === 404) { return showLogin("The orders API is off. Set ADMIN_API_TOKEN on the server and restart it."); }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      calls = rc.ok ? await rc.json() : [];
      businesses = rr.ok ? await rr.json() : [];
      const own = businesses.find(x => String(x.id) === businessId);
      if (businessId && rr.ok && !own) {  // saved choice no longer exists
        businessId = ""; try { localStorage.removeItem(RKEY); } catch {}
        return load();
      }
      document.getElementById("title").textContent = own ? own.name + " · Orders"
        : businesses.length === 1 ? businesses[0].name + " · Orders" : "Orders";
      const live = calls.find(c => c.call_id === openCall);
      if (openCall && (!transcripts.has(openCall) || (live && !live.ended_at))) await loadTranscript(openCall);
      const ids = new Set(data.map(o => o.id));
      const fresh = seen ? data.filter(o => !seen.has(o.id)).map(o => o.id) : [];
      seen = ids;
      orders = data;
      render(new Set(fresh));
      statusEl.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })
        + " · refreshes every " + REFRESH_MS / 1000 + "s";
    } catch (e) {
      statusEl.textContent = "Couldn't reach the server (" + e.message + "). Retrying…";
    }
  }

  function render(fresh = new Set()) {
    const tabs = el("div", { class: "tabs", role: "tablist" },
      [["orders", "Orders"], ["calls", "Calls"]].map(([k, label]) => el("button", {
        class: "tab", role: "tab", "aria-selected": String(view === k),
        onclick: () => { view = k; render(); },
      }, label + (k === "calls" && calls.length ? ` (${calls.length})` : ""))));
    const picker = businesses.length > 1 ? el("select", {
        "aria-label": "Business", class: "plain", style: "margin-left:auto;align-self:center",
        onchange: e => { businessId = e.target.value; try { localStorage.setItem(RKEY, businessId); } catch {}
                         seen = null; openCall = null; load(); },
      }, el("option", { value: "" }, "All businesses"),
      businesses.map(x => {
        const o = el("option", { value: String(x.id) }, x.name + (x.active ? "" : " (inactive)"));
        if (String(x.id) === businessId) o.selected = true;
        return o;
      })) : null;
    if (picker) tabs.append(picker);
    if (view === "calls") return app.replaceChildren(tabs, callList());
    const today = orders.filter(o => isToday(o.created_at) && o.status !== "cancelled");
    const tiles = el("section", { class: "tiles" },
      tile("Orders today", today.length),
      tile("Sales today", money(today.reduce((s, o) => s + o.total, 0))),
      tile("Paid today", money(today.filter(o => o.payment_status === "paid").reduce((s, o) => s + o.total, 0))),
      tile("Awaiting payment", orders.filter(o => o.status === "awaiting_payment").length));

    const filters = [["all", "All"], ["today", "Today"], ["unpaid", "Unpaid"], ["paid", "Paid"], ["cancelled", "Cancelled"]];
    const search = el("input", { type: "search", placeholder: "Search name, phone, item, #", value: query });
    search.addEventListener("input", () => { query = search.value; renderList(); });
    const controls = el("div", { class: "controls" },
      filters.map(([k, label]) => el("button", {
        class: "chip", "aria-pressed": String(filter === k),
        onclick: () => { filter = k; render(); },
      }, label)), search);

    const list = el("section", { class: "orders" });
    function renderList() {
      const q = query.trim().toLowerCase();
      const shown = orders.filter(o => {
        if (filter === "today" && !isToday(o.created_at)) return false;
        if (filter === "unpaid" && !(o.payment_status === "unpaid" || o.payment_status === "not_requested")) return false;
        if (filter === "paid" && o.payment_status !== "paid") return false;
        if (filter === "cancelled" && o.status !== "cancelled") return false;
        if (filter !== "cancelled" && filter !== "all" && o.status === "cancelled") return false;
        if (!q) return true;
        const hay = [o.order_number, o.customer_name, o.customer_phone, fmtPhone(o.customer_phone),
                     ...(o.lines || []).map(l => l.description)].join(" ").toLowerCase();
        return hay.includes(q.replace(/^#/, ""));
      });
      list.replaceChildren(...(shown.length ? shown.map(o => card(o, fresh.has(o.id)))
        : [el("div", { class: "empty" }, orders.length ? "No orders match." : "No phone orders yet. Call the number to place one.")]));
    }
    renderList();
    app.replaceChildren(tabs, tiles, controls, list);
    if (fresh.size) document.title = `(${fresh.size} new) ${BASE_TITLE}`;
  }

  const fmtDuration = c => {
    if (!c.ended_at) return "In progress";
    const s = Math.round(c.ended_at - c.started_at);
    return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  };
  const ROLE = { caller: "Caller", agent: "Agent", tool: "Tool", event: "" };

  function callList() {
    if (!calls.length) return el("div", { class: "empty" }, "No calls recorded yet.");
    return el("section", { class: "orders" }, calls.map(c => {
      const outcome = c.order_number ? badge(["Order #" + c.order_number, "ok"])
        : c.ended_at ? badge(["No order", "warn"]) : badge(["Live", ""]);
      const open = openCall === c.call_id;
      const events = transcripts.get(c.call_id);
      return el("article", { class: "call" },
        el("button", { "aria-expanded": String(open), onclick: async () => {
            openCall = open ? null : c.call_id;
            if (openCall && !transcripts.has(openCall)) { render(); await loadTranscript(openCall); }
            render();
          } },
          el("div", {}, el("div", { class: "who" }, fmtTime(c.started_at)), el("div", { class: "when" }, fmtDuration(c))),
          el("div", {}, !businessId && businesses.length > 1
              ? el("div", { class: "when" }, businessName(c.business_id)) : null,
            el("span", {}, fmtPhone(c.caller_phone) || "Unknown caller"),
            el("span", { class: "phone" }, `${c.caller_turns} caller turn${c.caller_turns === 1 ? "" : "s"}`)),
          el("div", { class: "badges" }, outcome)),
        open ? el("div", { class: "transcript" }, !events ? el("div", { class: "sub" }, "Loading transcript…")
          : events.length ? events.map(e => el("div", { class: "line " + e.role },
              el("div", { class: "role" }, ROLE[e.role] ?? e.role), el("div", { class: "text" }, e.text)))
          : el("div", { class: "sub" }, "Nothing was recorded for this call.")) : null);
    }));
  }

  const showCall = id => { view = "calls"; openCall = id; transcripts.delete(id); load(); };

  const tile = (label, value) => el("div", { class: "tile" },
    el("div", { class: "label" }, label), el("div", { class: "value" }, value));

  function card(o, isNew) {
    const lines = (o.lines || []).map(l => el("li", {},
      l.description.replace(/ \| /g, " · "), " ", el("span", { class: "sub" }, money(l.line_total))));
    const pay = PAY[o.payment_status] || [o.payment_status || "", ""];
    return el("article", { class: "order" + (isNew ? " new" : "") },
      el("div", {}, el("div", { class: "num" }, "#" + o.order_number), el("div", { class: "when" }, fmtTime(o.created_at)),
        !businessId && businesses.length > 1 ? el("div", { class: "when" }, businessName(o.business_id)) : null),
      el("div", {},
        el("span", { class: "who" }, o.customer_name || "No name"),
        o.customer_phone ? el("span", { class: "phone" }, fmtPhone(o.customer_phone)) : null,
        el("ul", { class: "items" }, lines)),
      el("div", { class: "right" },
        el("div", { class: "total" }, money(o.total)),
        el("div", { class: "sub" }, `Subtotal ${money(o.subtotal)} · Tax ${money(o.tax)}`),
        el("div", { class: "badges" }, badge(STATUS[o.status] || [o.status || "", ""]), badge(pay),
          o.pos_status ? el("span", { class: "badge " + (POS[o.pos_status] || ["", ""])[1],
                                      title: o.pos_error || "" }, (POS[o.pos_status] || [o.pos_status])[0]) : null),
        o.payment_url && o.payment_status === "unpaid"
          ? el("a", { href: o.payment_url, target: "_blank", rel: "noopener", class: "sub" }, "Payment link") : null,
        o.call_id && calls.some(c => c.call_id === o.call_id)
          ? el("a", { href: "#", class: "sub", onclick: e => { e.preventDefault(); showCall(o.call_id); } }, "Transcript") : null));
  }

  function start() {
    clearInterval(timer);
    app.replaceChildren(el("div", { class: "msg" }, "Loading orders…"));
    load();
    timer = setInterval(load, REFRESH_MS);
  }

  document.getElementById("refresh").addEventListener("click", () => token ? load() : showLogin());
  document.getElementById("logout").addEventListener("click", () => { store.clear(); token = ""; showLogin(); });
  window.addEventListener("focus", () => { document.title = BASE_TITLE; });
  token ? start() : showLogin();
})();
</script>
</body>
</html>
