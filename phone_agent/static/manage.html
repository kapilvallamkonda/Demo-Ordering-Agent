<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}}</title>
<meta name="application-name" content="{{BRAND}}">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e4e1da;
    --accent: #b4441f; --accent-text: #ffffff; --ok: #2f7d4f; --ok-bg: #e6f3eb; --warn: #8a5f00; --warn-bg: #fbf1d9;
    --bad: #a3322a; --bad-bg: #f9e3e1; --neutral-bg: #efede8; --shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #201f1c; --text: #ecebe7; --muted: #a29f97; --line: #34322e;
      --accent: #e0774f; --accent-text: #1d1c1a; --ok: #6cc591; --ok-bg: #1f3428; --warn: #e3b94f; --warn-bg: #3a3020;
      --bad: #ee8a80; --bad-bg: #3d2422; --neutral-bg: #2b2a26; --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
           justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  h1 { margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { padding: 18px 24px 80px; max-width: 1100px; margin: 0 auto; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px;
         font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  .status { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
  .status.draft { background: var(--warn-bg); color: var(--warn); }
  .status.live { background: var(--ok-bg); color: var(--ok); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  nav.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted);
                    border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .checks { display: grid; gap: 8px; margin-bottom: 14px; }
  .note { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.info { background: var(--neutral-bg); color: var(--muted); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=search], input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input:focus, textarea:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=search] { flex: 1; min-width: 160px; max-width: 340px; }
  textarea { width: 100%; resize: vertical; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px;
          font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
  .cat { margin-bottom: 14px; }
  .cat-head { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
  .cat-head h3 { margin: 0; font-size: 15px; }
  .items { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px;
          border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--bg); }
  .item.off .name { text-decoration: line-through; color: var(--muted); }
  .item .name { font-weight: 600; }
  .item .desc { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .main { min-width: 0; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { width: 34px; height: 20px; appearance: none; background: var(--line); border-radius: 999px; position: relative;
                  cursor: pointer; transition: background .15s; margin: 0; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                         background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--ok); }
  .switch input:checked::after { left: 16px; }
  .field { display: grid; gap: 4px; margin-bottom: 14px; }
  .field label, .lbl { font-weight: 600; font-size: 14px; }
  .field .help { color: var(--muted); font-size: 13px; }
  .field > .btn, .field > .linkish, .group > .linkish { justify-self: start; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .grow { flex: 1; }
  .money { position: relative; display: inline-flex; align-items: center; }
  .money span { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
  .money input { padding-left: 20px; width: 110px; }
  .group { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: grid; gap: 8px; }
  .settings-group { margin-bottom: 18px; }
  .settings-group h2 { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .placeholder { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--warn-bg); color: var(--warn);
                 border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21;
            box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .versions .v { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .versions .v:first-child { border-top: 0; }
  .center { min-height: 80vh; display: grid; place-items: center; padding: 16px; }
  .card { width: min(400px, 100%); }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
           padding: 9px 16px; border-radius: 8px; z-index: 40; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px;
           width: min(440px, calc(100% - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  /* ---- app shell, onboarding and the new views ---- */
  .logo { font-weight: 750; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .logo .name { letter-spacing: -0.02em; }
  .markwrap { display: inline-flex; flex: none; }
  .markwrap svg { display: block; }
  .btn.google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px 16px;
                font-weight: 600; text-decoration: none; color: var(--text); }
  .gicon { display: inline-flex; background: #fff; border-radius: 50%; padding: 3px; }
  .btn.big { padding: 11px 20px; font-size: 15px; }
  details.pwlogin { margin-top: 16px; } details.pwlogin summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .card.wide { width: min(640px, 100%); }
  .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .kindcard { text-align: left; display: grid; gap: 4px; align-content: start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
              background: var(--panel); cursor: pointer; }
  .kindcard[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .kindcard:disabled { opacity: .55; cursor: not-allowed; }
  .kindcard .badge { justify-self: start; }
  .picker { font-weight: 650; font-size: 16px; border: 1px solid transparent; background: transparent; max-width: 60vw; }
  .picker:hover { border-color: var(--line); }
  .usermenu { position: relative; } .usermenu summary { list-style: none; cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
    background: var(--neutral-bg); display: grid; place-items: center; font-weight: 700; }
  .usermenu summary::-webkit-details-marker { display: none; }
  .usermenu .menu { position: absolute; right: 0; top: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; gap: 10px; min-width: 220px; box-shadow: var(--shadow); z-index: 10; }
  .row.wrap { flex-wrap: wrap; }
  .home { display: grid; gap: 12px; }
  .hello { font-size: 24px; margin: 4px 0 0; white-space: normal; overflow: visible; }
  ol.steps { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
  .step { display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .step h3 { margin: 0 0 4px; font-size: 16px; } .step p { margin: 0 0 10px; }
  .step.current { border-color: var(--accent); }
  .step.done h3 { color: var(--muted); } .step.done .sub { display: none; }
  .tick { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
          background: var(--neutral-bg); color: var(--muted); }
  .step.done .tick { background: var(--ok-bg); color: var(--ok); } .step.current .tick { background: var(--accent); color: var(--accent-text); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 13px; } .tile .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .liveline { display: grid; gap: 12px; }
  .bigphone { font-size: 30px; font-weight: 750; letter-spacing: .01em; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
  .orders, .calls { display: grid; gap: 10px; }
  .ocard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
  .ohead { display: flex; gap: 10px; align-items: baseline; }
  .olines { margin: 2px 0 4px; padding-left: 18px; font-size: 14px; }
  .who { font-weight: 600; }
  details.call summary { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .transcript { margin-top: 10px; display: grid; gap: 4px; font-size: 14px; }
  .transcript .role { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .transcript .line.tool, .transcript .line.event { color: var(--muted); font-size: 13px; }
  ul.people { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.people li { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .chatlog { display: grid; gap: 8px; align-content: start; min-height: 240px; max-height: 60vh; overflow-y: auto; padding: 4px 0 12px; }
  .msg { display: grid; gap: 3px; } .msg.caller { justify-items: end; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--neutral-bg); }
  .msg.caller .bubble { background: var(--accent); color: var(--accent-text); }
  .toolnote { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .chatform { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .item { grid-template-columns: 1fr auto; }
    .item .switch span { display: none; }
    .item .price { grid-column: 2; grid-row: 1; }
    .item .switch { grid-column: 2; grid-row: 2; justify-self: end; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const dlg = document.getElementById("dlg");
  const API = "/api/manage";
  // Words and tags for this kind of business come from its template (S.ed.template).
  const W = () => S.ed.template.words;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const SAVE_DELAY = 1200;

  // ---- tiny DOM helper (text is always set as text, never HTML) ----
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "class") n.className = v;
      else if (k === "value") n.value = v;
      else if (k === "checked") n.checked = !!v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
    return n;
  }
  const money = n => "$" + Number(n || 0).toFixed(2);
  const round2 = n => Math.round(Number(n) * 100) / 100;
  const ago = t => {
    const s = Math.max(0, Date.now() / 1000 - t);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(t * 1000).toLocaleDateString();
  };
  const fmtTime = t => new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  function toast(msg) {
    const t = el("div", { class: "toast", role: "status" }, msg);
    document.body.append(t);
    setTimeout(() => t.remove(), 3200);
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(method, path, body) {
    const opts = { method, headers: { "X-Manage": "1" }, credentials: "same-origin" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    const r = await fetch(API + path, opts);
    let data = null;
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      const e = new Error((data && data.detail) || ("Request failed (" + r.status + ")"));
      e.status = r.status; e.data = data;
      throw e;
    }
    return data;
  }

  // ---- state ----
  const S = {
    me: null, rid: null, ed: null,       // ed: editor state from the server
    catalog: null, revision: null,          // working copy and draft revision
    tab: "home", q: "", filter: "all", collapsed: new Set(), line: null, chat: null,
    dirty: false, saving: false, saveTimer: null, saveError: null, lastSaved: null,
    drawer: null,                        // {item, isNew}
    versions: null,
  };

  // ---- sign in ----
  let CONFIG = { google: false, password_login: true };
  const G_ICON = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
  function icon(svg) { const s = el("span", { class: "gicon" }); s.innerHTML = svg; return s; }  // constant markup only
  const BRAND = (document.querySelector('meta[name="application-name"]') || {}).content || document.title;
  const MARK = '<svg class="mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill:var(--accent)"/><circle cx="14" cy="14" r="7.5" fill="none" stroke-width="2.6" style="stroke:var(--accent-text)"/><circle cx="14" cy="14" r="2.6" style="fill:var(--accent-text)"/></svg>';
  const mark = () => { const s = el("span", { class: "markwrap" }); s.innerHTML = MARK; return s; };  // constant markup only
  const logo = () => el("div", { class: "logo" }, mark(), el("span", { class: "name" }, BRAND));

  function screen(...kids) { app.replaceChildren(el("div", { class: "center" }, el("div", { class: "panel card" }, ...kids))); }

  function showLogin(msg) {
    const err = el("div", { class: "err", role: "alert" }, msg || "");
    const kids = [logo(), el("h2", { style: "margin-top:18px" }, "Sign in"),
      el("p", { class: "sub" }, "Manage your phone agent: orders, calls, what you sell and how it answers.")];
    if (CONFIG.google) kids.push(el("a", { class: "btn google", href: "/auth/google" }, icon(G_ICON), "Continue with Google"),
      el("p", { class: "sub", style: "margin-top:12px" }, "New here? Signing in creates your account."));
    if (CONFIG.password_login) {
      const email = el("input", { type: "email", id: "email", autocomplete: "username", required: true });
      const pw = el("input", { type: "password", id: "pw", autocomplete: "current-password", required: true });
      const submit = el("button", { class: "btn primary", type: "submit" }, "Sign in");
      const form = el("form", { onsubmit: async e => {
          e.preventDefault(); submit.disabled = true; err.textContent = "";
          try { await api("POST", "/login", { email: email.value, password: pw.value }); boot(); }
          catch (x) { err.textContent = x.message; submit.disabled = false; }
        } },
        el("div", { class: "field" }, el("label", { for: "email" }, "Email"), email),
        el("div", { class: "field" }, el("label", { for: "pw" }, "Password"), pw), el("div", { class: "row" }, submit));
      kids.push(CONFIG.google ? el("details", { class: "pwlogin" }, el("summary", {}, "Use email and password instead"), form) : form);
    }
    kids.push(err);
    screen(...kids);
  }

  function showInvite(token) {
    const name = el("input", { type: "text", id: "nm", autocomplete: "name" });
    const pw = el("input", { type: "password", id: "pw1", autocomplete: "new-password", minlength: 10, required: true });
    const pw2 = el("input", { type: "password", id: "pw2", autocomplete: "new-password", required: true });
    const err = el("div", { class: "err", role: "alert" });
    const submit = el("button", { class: "btn primary", type: "submit" }, "Set password and sign in");
    screen(el("form", {
      onsubmit: async e => {
        e.preventDefault(); err.textContent = "";
        if (pw.value !== pw2.value) { err.textContent = "The passwords don't match."; return; }
        submit.disabled = true;
        try {
          await api("POST", "/accept-invite", { token, password: pw.value, name: name.value });
          history.replaceState(null, "", location.pathname);
          boot();
        } catch (x) { err.textContent = x.message; submit.disabled = false; }
      }
    },
      logo(), el("h2", { style: "margin-top:18px" }, "Welcome"),
      el("p", { class: "sub" }, "Choose a password. Use at least 10 characters."),
      el("div", { class: "field" }, el("label", { for: "nm" }, "Your name"), name),
      el("div", { class: "field" }, el("label", { for: "pw1" }, "Password"), pw),
      el("div", { class: "field" }, el("label", { for: "pw2" }, "Password again"), pw2),
      err, submit));
    name.focus();
  }

  async function boot() {
    try { CONFIG = await api("GET", "/config"); } catch {}
    const m = location.hash.match(/invite=([\w-]+)/);
    if (m) return showInvite(m[1]);
    try { S.me = await api("GET", "/me"); }
    catch (e) { if (e.status === 401) return showLogin(); return screen(el("p", {}, e.message)); }
    if (!S.me.businesses.length) return showCreate(true);
    const saved = Number(store.get("manage.business"));
    S.rid = S.me.businesses.some(r => r.id === saved) ? saved : S.me.businesses[0].id;
    await loadEditor();
  }

  // ---- create a business ----
  async function showCreate(first) {
    let templates = [];
    try { templates = await api("GET", "/templates"); } catch (e) { return screen(el("p", {}, e.message)); }
    let chosen = (templates.find(t => t.status === "available") || {}).id;
    const name = el("input", { type: "text", id: "bname", maxlength: 80, placeholder: "e.g. Rosa's Bakery", required: true });
    const err = el("div", { class: "err", role: "alert" });
    const cards = el("div", { class: "kinds", role: "radiogroup", "aria-label": "Type of business" });
    const drawCards = () => cards.replaceChildren(...templates.map(t => {
      const soon = t.status !== "available";
      return el("button", { type: "button", class: "kindcard", role: "radio", "aria-checked": t.id === chosen ? "true" : "false",
        disabled: soon || null, onclick: () => { chosen = t.id; drawCards(); } },
        el("strong", {}, t.label.replace(" (coming soon)", "")), soon ? el("span", { class: "badge" }, "Coming soon") : null,
        el("span", { class: "sub" }, t.description));
    }));
    drawCards();
    const submit = el("button", { class: "btn primary big", type: "submit" }, "Create my phone agent");
    screen(el("form", { onsubmit: async e => {
        e.preventDefault(); err.textContent = ""; submit.disabled = true;
        try {
          const r = await api("POST", "/businesses", { name: name.value, template: chosen });
          S.me = await api("GET", "/me"); S.rid = r.id; store.set("manage.business", r.id); S.tab = "home";
          await loadEditor();
        } catch (x) { err.textContent = x.message; submit.disabled = false; }
      } },
      logo(),
      el("h2", { style: "margin-top:18px" }, first ? "Let's set up your phone agent" : "Add a business"),
      el("p", { class: "sub" }, "It takes about ten minutes. You can change everything later."),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "What kind of business is it?"), cards),
      el("div", { class: "field" }, el("label", { for: "bname" }, "Business name"), name),
      err, el("div", { class: "row", style: "justify-content:space-between" },
        first ? signOutBtn() : el("button", { class: "btn", type: "button", onclick: () => loadEditor() }, "Cancel"), submit)));
    app.querySelector(".card").classList.add("wide");

  async function loadEditor() {
    app.replaceChildren(el("div", { class: "center" }, el("p", { class: "muted" }, "Loading…")));
    S.ed = await api("GET", `/businesses/${S.rid}/editor`);
    S.catalog = structuredClone(S.ed.catalog || { settings: { name: "" }, items: [] });
    S.revision = S.ed.draft ? S.ed.draft.revision : null;
    S.dirty = false; S.saveError = null; S.versions = null; S.drawer = null; S.line = null; S.chat = null;
    render();
  }

  // ---- saving ----
  function changed(rerender = true) {
    S.dirty = true; S.saveError = null;
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(saveDraft, SAVE_DELAY);
    if (rerender) render(); else renderHeader();
  }

  async function saveDraft() {
    if (S.saving) { S.saveTimer = setTimeout(saveDraft, 400); return; }
    if (!S.dirty) return;
    S.saving = true; S.dirty = false; renderHeader();
    try {
      const r = await api("PUT", `/businesses/${S.rid}/draft`, { catalog: S.catalog, revision: S.revision });
      S.revision = r.revision; S.ed.check = r.check; S.lastSaved = Date.now() / 1000;
      if (!S.ed.draft) S.ed.draft = { revision: r.revision, live_changed: false, updated_by: S.me.who };
      S.ed.draft.revision = r.revision;
    } catch (e) {
      S.dirty = true;
      S.saveError = e.message;
      if (e.status === 409) conflict(e.message);
      else if (e.status === 401) showLogin("You were signed out. Sign in again; unsaved edits on this page are lost.");
    } finally {
      S.saving = false;
      if (S.ed) { renderHeader(); renderChecks(); }
    }
  }

  async function flush() {
    clearTimeout(S.saveTimer);
    if (S.dirty) await saveDraft();
    while (S.saving) await new Promise(r => setTimeout(r, 100));
    if (S.saveError) throw new Error(S.saveError);
  }

  window.addEventListener("beforeunload", e => { if (S.dirty || S.saving) { e.preventDefault(); e.returnValue = ""; } });

  function conflict(msg) {
    ask({ title: `Someone else changed this ${W().catalog}`, body: msg + " Your last few edits weren't saved.",
          ok: "Reload", cancel: null }).then(loadEditor);
  }

  async function publish() {
    try { await flush(); } catch (e) { return toast("Couldn't save: " + e.message); }
    const c = S.ed.check || {};
    if (c.errors && c.errors.length) return toast("Fix the items marked “Fix before publishing” first.");
    const lines = [];
    if (c.blockers && c.blockers.length) lines.push("Still to confirm: " + c.blockers.join(" · "));
    const live = S.line && S.line.phone_number;
    const ok = await ask({ title: "Publish these changes?",
      body: (live ? `Callers will hear the new ${W().catalog} from the next call. ` : "This is the version your agent will use. ") + lines.join(" "),
      ok: "Publish" });
    if (!ok) return;
    let overwrite = false;
    for (;;) {
      try {
        const r = await api("POST", `/businesses/${S.rid}/publish`, { revision: S.revision, overwrite });
        S.ed = r; S.catalog = structuredClone(r.catalog); S.revision = null; S.versions = null; S.line = null;
        toast(live ? `Published. The next call uses the new ${W().catalog}.` : "Published.");
        return render();
      } catch (e) {
        if (e.status === 409 && e.data && e.data.code === "live_changed") {
          const yes = await ask({ title: `A newer ${W().catalog} was published`,
            body: `Someone published a ${W().catalog} after you started this draft. Publishing yours replaces it.`, ok: "Publish mine anyway" });
          if (!yes) return;
          overwrite = true; continue;
        }
        if (e.status === 409) return conflict(e.message);
        if (e.status === 422) { S.ed.check = e.data.check; render(); return toast("Fix the items marked “Fix before publishing” first."); }
        return toast(e.message);
      }
    }
  }

  async function discard() {
    const ok = await ask({ title: "Discard all unpublished changes?", body: `The ${W().catalog} goes back to the published version.`, ok: "Discard", danger: true });
    if (!ok) return;
    clearTimeout(S.saveTimer); S.dirty = false;
    try { S.ed = await api("DELETE", `/businesses/${S.rid}/draft`); } catch (e) { return toast(e.message); }
    S.catalog = structuredClone(S.ed.catalog); S.revision = null;
    render();
  }

  // ---- dialogs ----
  function ask({ title, body, ok = "OK", cancel = "Cancel", danger = false, input = null }) {
    return new Promise(resolve => {
      const field = input ? el("input", { type: "text", value: input.value || "", style: "width:100%", "aria-label": title }) : null;
      const done = v => { dlg.close(); resolve(v); };
      dlg.replaceChildren(el("form", { method: "dialog", onsubmit: e => { e.preventDefault(); done(field ? field.value.trim() : true); } },
        el("h2", {}, title), body ? el("p", { class: "sub" }, body) : null, field,
        el("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" },
          cancel ? el("button", { class: "btn", type: "button", onclick: () => done(null) }, cancel) : null,
          el("button", { class: "btn " + (danger ? "danger" : "primary"), type: "submit" }, ok))));
      dlg.onclose = () => resolve(null);
      dlg.showModal();
      if (field) { field.focus(); field.select(); }
    });
  }

  // A panel that slides in from the right (test chat, reading a menu). Returns its body element.
  function sidePanel(title, onClose) {
    document.querySelectorAll(".side, .side-bg").forEach(n => n.remove());
    const close = () => { document.querySelectorAll(".side, .side-bg").forEach(n => n.remove()); if (onClose) onClose(); };
    const body = el("div", { class: "drawer-body" });
    const panel = el("aside", { class: "drawer side", role: "dialog", "aria-modal": "true", "aria-label": title,
                                onkeydown: e => { if (e.key === "Escape") close(); } },
      el("div", { class: "drawer-head" }, el("h2", { style: "margin:0" }, title),
        el("button", { class: "btn small", onclick: close, "aria-label": "Close" }, "✕")), body);
    document.body.append(el("div", { class: "drawer-bg side-bg", onclick: close }), panel);
    return { body, panel, close };
  }

  let refreshTimer = null;
  const TABS = () => [["home", "Home"], ["orders", "Orders"], ["calls", "Calls"], ["catalog", cap(W().catalog)],
    ["settings", "Settings"], ["team", "Team"], ["history", "History"]].concat(S.me.operator ? [["operator", "Operator"]] : []);

      el("main", {},
        el("nav", { class: "tabs", role: "tablist" },

                    team: teamView, history: historyView, operator: operatorView };

  function renderHeader() {
    const hdr = document.getElementById("hdr");
    if (!hdr) return;
    const hasDraft = !!S.ed.draft || S.dirty;
    let status = null;
    if (S.saveError) status = el("span", { class: "status bad", title: S.saveError }, "Not saved");
    else if (S.saving || S.dirty) status = el("span", { class: "status draft" }, "Saving…");
    else if (hasDraft) status = el("span", { class: "status draft",
      title: S.ed.draft && S.ed.draft.updated_by ? "Last edit by " + S.ed.draft.updated_by : "" },
      "Unpublished changes" + (S.lastSaved ? " · saved " + ago(S.lastSaved) : ""));
    const errors = (S.ed.check && S.ed.check.errors.length) || 0;
    const user = el("details", { class: "usermenu" }, el("summary", { "aria-label": "Account" }, (S.me.email || S.me.who || "?")[0].toUpperCase()),
      el("div", { class: "menu" }, el("div", { class: "sub" }, S.me.email || S.me.who), signOutBtn()));
    hdr.replaceChildren(...[status,
      hasDraft && S.ed.live_catalog_id ? el("button", { class: "btn small", onclick: discard }, "Discard") : null,
      hasDraft ? el("button", { class: "btn primary", disabled: errors > 0 || null,
                                title: errors ? "Fix the errors first" : "", onclick: publish }, "Publish") : null,
      user].filter(Boolean));
  }

  function renderChecks() {
    const box = document.getElementById("checks");
    if (!box) return;
    if (!["catalog", "settings"].includes(S.tab)) return box.replaceChildren();
    const c = S.ed.check;
    const parts = [];
    if (S.ed.draft && S.ed.draft.live_changed)
      parts.push(el("div", { class: "note warn" }, `A newer ${W().catalog} was published after this draft was started. Publishing this draft will replace it; discard the draft to start from the newest one.`));
    if (c && c.errors.length) parts.push(el("div", { class: "note bad", role: "alert" },
      el("strong", {}, "Fix before publishing"), el("ul", {}, c.errors.map(m => el("li", {}, m)))));
    if (c && c.blockers.length) parts.push(el("div", { class: "note warn" },
      el("strong", {}, "Please confirm"), el("ul", {}, c.blockers.map(m => el("li", {}, m)))));
    if (c && c.warnings.length) {
      const d = el("details", { class: "note info" }, el("summary", {}, `${c.warnings.length} suggestion${c.warnings.length > 1 ? "s" : ""}`),
        el("ul", {}, c.warnings.map(m => el("li", {}, m))));

    if (S.ed.pos_provider) parts.push(el("div", { class: "note info" },
      `Orders go to ${cap(S.ed.pos_provider)}. Items linked to it use the POS's own prices on the POS; change prices there too.`));
    box.replaceChildren(...parts);
  }

  // ---- catalog tab ----
  const isEstimated = it => !!it.placeholder_price;
  const isOff = it => it.available === false;

  function catalogView() {
    const items = S.catalog.items;
    const q = S.q.trim().toLowerCase();
    const shown = items.filter(it =>
      (!q || (it.name + " " + (it.description || "") + " " + it.category).toLowerCase().includes(q)) &&
      (S.filter === "all" || (S.filter === "off" && isOff(it)) || (S.filter === "est" && isEstimated(it))));
    const cats = [];
    const byCat = new Map();
    for (const it of shown) {
      if (!byCat.has(it.category)) { byCat.set(it.category, []); cats.push(it.category); }
      byCat.get(it.category).push(it);
    }
    const search = el("input", { type: "search", placeholder: "Search " + W().items, value: S.q, "aria-label": "Search " + W().items,
      oninput: e => { S.q = e.target.value; const v = document.getElementById("view"); v.replaceChildren(catalogView());
                      const s = v.querySelector("input[type=search]"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
    const chip = (k, label) => el("button", { class: "chip", "aria-pressed": S.filter === k ? "true" : "false",
      onclick: () => { S.filter = k; render(); } }, label);

      el("div", { class: "toolbar" }, search, chip("all", `All ${items.length}`),
        nOff ? chip("off", `${W().unavailable_short} ${nOff}`) : null, nEst ? chip("est", `Estimated price ${nEst}`) : null,
        el("span", { class: "grow" }),
        el("button", { class: "btn", onclick: openImport }, "Read from photos or PDF"),
        el("button", { class: "btn primary", onclick: () => openItem(null) }, "+ Add " + W().item)),
      cats.length ? cats.map(cat => categoryBlock(cat, byCat.get(cat), !!q || S.filter !== "all"))
        : el("div", { class: "empty" }, items.length ? `No ${W().items} match.` : `No ${W().items} yet. Add your first one.`));
  }

  function categoryBlock(cat, items, forceOpen) {

      el("div", { class: "main" },

  async function renameCategory(cat) {
    const name = await ask({ title: "Rename " + W().section, body: `Renames "${cat}" for every ${W().item} in it.`, ok: "Rename", input: { value: cat } });

  // ---- item drawer ----
  const slug = s => (s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "item");

        el("button", { class: "btn small", type: "button", onclick: () => { delete it.placeholder_price; edit(true); } }, "It's right")) : null,
      el("div", { class: "field" }, el("label", { for: "f-desc" }, "Description"),

        el("span", { class: "help" }, "Short. The agent uses it to answer questions. Tap tags to add them:"), tags),
      el("div", { class: "field" },
        el("label", { class: "switch", style: "color:inherit" },
          el("input", { type: "checkbox", checked: !isOff(it), onchange: e => { if (e.target.checked) delete it.available; else it.available = false; edit(true); } }),
          el("span", {}, isOff(it) ? `${W().unavailable_short}: the agent says it's unavailable` : "Available to order"))),
      optionsEditor(it, edit),
      extrasEditor(it, edit),
      !isNew ? el("p", { class: "sub" }, `${cap(W().item)} id: ${it.id}` + (it.pos ? " · linked to the POS" : "")) : null);

    const foot = el("div", { class: "drawer-foot" },
      isNew ? el("span") : el("button", { class: "btn danger", type: "button", onclick: async () => {
        if (!await ask({ title: `Delete "${it.name}"?`, body: "Callers won't be able to order it once you publish.", ok: "Delete", danger: true })) return;
        S.catalog.items.splice(S.catalog.items.indexOf(it), 1);
        changed(false); closeDrawer();
      } }, "Delete " + W().item),
      el("div", { class: "row" },
        el("button", { class: "btn", type: "button", onclick: closeDrawer }, isNew ? "Cancel" : "Done"),
        isNew ? el("button", { class: "btn primary", type: "button", onclick: () => {
          if (!it.name.trim()) return toast(`Give the ${W().item} a name.`);
          if (!it.category.trim()) return toast(`Choose a ${W().section}.`);
          if (!(it.price > 0)) return toast("Set a price.");
          const ids = new Set(S.catalog.items.map(i => i.id));
          let id = slug(it.name), n = 2;
          while (ids.has(id)) id = slug(it.name) + "_" + n++;
          S.catalog.items.push({ id, ...it });
          S.drawer = null; changed(); toast(`Added "${it.name}".`);

    return later(box, async () => {
      const pos = await api("GET", `/businesses/${S.rid}/pos`);
      const head = [el("h2", {}, "Point of sale"), el("p", { class: "sub" }, "Send phone orders straight to your Square or Clover register.")];
      if (pos.connected) return [...head, el("p", {}, badge(["Connected", "ok"]), " ", cap(pos.connected.provider)),
        isOwner() ? el("button", { class: "btn small danger", onclick: async () => {
          if (!await ask({ title: "Disconnect your POS?", body: "New orders will only show here.", ok: "Disconnect", danger: true })) return;
          await api("DELETE", `/businesses/${S.rid}/pos`); render();
        } }, "Disconnect") : null];
      if (!pos.available.length) return [...head, el("p", { class: "sub" }, "Coming soon.")];
      return [...head, isOwner() ? el("div", { class: "row wrap" }, pos.available.map(p => el("button", { class: "btn", onclick: async () => {
        try { location.href = (await api("POST", `/businesses/${S.rid}/pos`, { provider: p })).url; } catch (e) { toast(e.message); }
      } }, "Connect " + cap(p)))) : el("p", { class: "sub" }, "Ask the owner to connect it.")];
    });
  }

  // ---- operator ----
  function operatorView() {
    const box = el("div", {}, loading());
    const load = () => later(box, async () => {
      const reqs = await api("GET", "/admin/requests");
      return el("div", { class: "panel" }, el("h2", {}, "Waiting to go live"),
        el("p", { class: "sub" }, "Businesses past the automatic number limit. Approving buys their number."),
        reqs.length ? el("ul", { class: "people" }, reqs.map(r => el("li", {},
          el("div", { class: "grow" }, el("strong", {}, r.name), el("div", { class: "sub" }, `${r.email || "?"} · area ${r.area_code || "any"} · ${fmtTime(r.created_at)}`)),
          el("button", { class: "btn small primary", onclick: async () => {
            try { const x = await api("POST", `/admin/requests/${r.id}/approve`); toast(`Live on ${fmtPhone(x.phone_number)}`); load(); } catch (e) { toast(e.message); }
          } }, "Approve"),
          el("button", { class: "btn small", onclick: async () => { await api("POST", `/admin/requests/${r.id}/reject`); load(); } }, "Decline"))))
          : el("p", { class: "muted" }, "Nothing waiting."));
    });
    load();
    return box;
  }

  // ---- talk to my agent ----
  async function openTestChat() {
    try { await flush(); } catch (e) { return toast("Couldn't save: " + e.message); }
    const { body } = sidePanel("Talk to your agent");
    const log = el("div", { class: "chatlog", "aria-live": "polite" });
    const input = el("input", { type: "text", class: "grow", placeholder: "Type what a caller would say", "aria-label": "Message", maxlength: 500 });
    const send = el("button", { class: "btn primary", type: "submit" }, "Send");
    const bubble = (who, text, events) => log.append(el("div", { class: "msg " + who }, el("div", { class: "bubble" }, text),
      (events || []).filter(e => !e.error && e.tool !== "view_order").map(e => el("div", { class: "toolnote" }, toolLabel(e)))));
    S.chat = { business: S.rid, session: null };
    body.append(el("p", { class: "sub" }, "Uses your latest changes, even unpublished ones. Nothing is saved and no texts are sent."),
      log, el("form", { class: "row chatform", onsubmit: async e => {
        e.preventDefault();
        const text = input.value.trim(); if (!text) return;
        input.value = ""; bubble("caller", text); send.disabled = true;
        const typing = el("div", { class: "msg agent" }, el("div", { class: "bubble muted" }, "…")); log.append(typing);
        log.scrollTop = log.scrollHeight;
        try {
          const r = await api("POST", `/businesses/${S.rid}/test-chat`, { text, session: S.chat.session });
          typing.remove();
          if (!S.chat.session && r.greeting) log.prepend(el("div", { class: "msg agent" }, el("div", { class: "bubble" }, r.greeting)));
          S.chat.session = r.session;
          bubble("agent", r.reply || "(no reply)", r.events);
          if (r.ended) log.append(el("p", { class: "sub" }, "The agent ended the call."));
          store.set("tried." + S.rid, "1");
        } catch (x) { typing.remove(); bubble("agent", x.message); }
        send.disabled = false; log.scrollTop = log.scrollHeight; input.focus();
      } }, input, send));
    input.focus();
  }
  const toolLabel = e => {
    const a = e.args || {};
    const item = (S.catalog.items.find(i => i.id === a.item_id) || {}).name || a.item_id;
    return { add_item: `Added ${a.quantity || 1} × ${item}`, remove_item: "Removed an item", update_quantity: "Changed a quantity",
             set_customer_name: `Name: ${a.name}`, set_customer_phone: "Updated the phone number", place_order: "Placed the order (test only)",
             end_call: "Hung up" }[e.tool] || e.tool;
  };

  // ---- read a menu from photos or a PDF ----
  async function shrink(file) {  // big phone photos -> JPEG under 2000px, so uploads are quick
    if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
      return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
    } catch { return file; }  // the server says which formats it takes
  }

  async function openImport() {
    try { await flush(); } catch (e) { return toast("Couldn't save: " + e.message); }
    const { body, close } = sidePanel(`Read your ${W().catalog}`);
    const files = el("input", { type: "file", multiple: true, accept: "image/*,application/pdf", id: "files" });
    const hasItems = S.catalog.items.length > 0;
    const mode = el("select", { "aria-label": "What to do with what's there" },
      el("option", { value: "append" }, `Add to my ${W().catalog}`), el("option", { value: "replace" }, `Replace my ${W().catalog}`));
    const status = el("div", { "aria-live": "polite" });
    const go = el("button", { class: "btn primary big", onclick: async () => {
      if (!files.files.length) return toast("Choose at least one photo or PDF.");
      go.disabled = true;
      status.replaceChildren(el("div", { class: "note info" }, el("strong", {}, "Reading…"),
        ` This usually takes under a minute. We're turning ${files.files.length} file(s) into ${W().items}.`));
      try {
        const form = new FormData();
        for (const f of files.files) form.append("files", await shrink(f));
        const r = await upload(`/businesses/${S.rid}/import?mode=${mode.value}` + (S.revision ? `&revision=${S.revision}` : ""), form);
        S.ed = r; S.catalog = structuredClone(r.catalog); S.revision = r.draft ? r.draft.revision : null;
        close(); S.tab = "catalog"; render();
        toast(`Added ${r.added} ${W().items}. Check prices, then publish.`);
        if (r.unreadable && r.unreadable.length) ask({ title: "A few things couldn't be read", body: r.unreadable.join(" · "), cancel: null });
      } catch (e) { status.replaceChildren(el("p", { class: "err" }, e.message)); go.disabled = false; }
    } }, `Read my ${W().catalog}`);
    body.append(...[
      el("p", { class: "sub" }, `Take clear photos of every page of your ${W().catalog} (or upload a PDF). We'll list every ${W().item} with its price and choices. You review everything before it goes live.`),
      el("div", { class: "field" }, el("label", { for: "files" }, "Photos or PDF (up to 10)"), files),
      hasItems ? el("div", { class: "field" }, el("span", { class: "lbl" }, `You already have ${S.catalog.items.length} ${W().items}`), mode) : null,
      el("p", { class: "sub" }, "Prices we can't read are marked “estimated” for you to check."),
      go, status].filter(Boolean));
  }

  async function upload(path, form) {
    const r = await fetch(API + path, { method: "POST", body: form, headers: { "X-Manage": "1" }, credentials: "same-origin" });
    let data = null; try { data = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((data && data.detail) || `Upload failed (${r.status})`); e.status = r.status; throw e; }
    return data;
  }

  window.addEventListener("hashchange", () => { if (/invite=/.test(location.hash)) boot(); });
  boot();
})();
</script>
</body>
</html>
