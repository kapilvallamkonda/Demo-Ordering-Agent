<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}}</title>
<meta name="application-name" content="{{BRAND}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/web-analytics.js?page=manage" async></script>
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e4e1da;
    --accent: #b4441f; --accent-text: #ffffff; --ok: #2f7d4f; --ok-bg: #e6f3eb; --warn: #8a5f00; --warn-bg: #fbf1d9;
    --bad: #a3322a; --bad-bg: #f9e3e1; --neutral-bg: #efede8; --shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #201f1c; --text: #ecebe7; --muted: #a29f97; --line: #34322e;
      --accent: #e0774f; --accent-text: #1d1c1a; --ok: #6cc591; --ok-bg: #1f3428; --warn: #e3b94f; --warn-bg: #3a3020;
      --bad: #ee8a80; --bad-bg: #3d2422; --neutral-bg: #2b2a26; --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
           justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  h1 { margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { padding: 18px 24px 80px; max-width: 1100px; margin: 0 auto; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px;
         font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .startover { margin-top: 18px; }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  .status { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
  .status.draft { background: var(--warn-bg); color: var(--warn); }
  .status.live { background: var(--ok-bg); color: var(--ok); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  nav.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted);
                    border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .checks { display: grid; gap: 8px; margin-bottom: 14px; }
  .note { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.info { background: var(--neutral-bg); color: var(--muted); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=search], input[type=text], input[type=email], input[type=password], input[type=number],
  input[type=url], input[type=tel], textarea, select {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input:focus, textarea:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=search] { flex: 1; min-width: 160px; max-width: 340px; }
  textarea { width: 100%; resize: vertical; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px;
          font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
  .cat { margin-bottom: 14px; }
  .cat-head { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
  .cat-head h3 { margin: 0; font-size: 15px; }
  .items { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px;
          border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--bg); }
  .item.off .name { text-decoration: line-through; color: var(--muted); }
  .item .name { font-weight: 600; }
  .item .desc { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .main { min-width: 0; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { width: 34px; height: 20px; appearance: none; background: var(--line); border-radius: 999px; position: relative;
                  cursor: pointer; transition: background .15s; margin: 0; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                         background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--ok); }
  .switch input:checked::after { left: 16px; }
  .field { display: grid; gap: 4px; margin-bottom: 14px; }
  .field label, .lbl { font-weight: 600; font-size: 14px; }
  .field .help { color: var(--muted); font-size: 13px; }
  .field > .btn, .field > .linkish, .group > .linkish { justify-self: start; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .grow { flex: 1; }
  .money { position: relative; display: inline-flex; align-items: center; }
  .money span { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
  .money input { padding-left: 20px; width: 110px; }
  .group { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; display: grid; gap: 8px; }
  .settings-group { margin-bottom: 18px; }
  .settings-group h2 { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .placeholder { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--warn-bg); color: var(--warn);
                 border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21;
            box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .versions .v { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .versions .v:first-child { border-top: 0; }
  .center { min-height: 80vh; display: grid; place-items: center; padding: 16px; }
  .card { width: min(400px, 100%); }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
           padding: 9px 16px; border-radius: 8px; z-index: 40; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px;
           width: min(440px, calc(100% - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  /* ---- app shell, onboarding and the new views ---- */
  .wordmark { display: inline-block; color: var(--text); font-weight: 820; font-size: 24px; letter-spacing: -0.045em; line-height: 1;
              text-transform: lowercase; text-decoration: none; }
  .markwrap { display: inline-flex; flex: none; }
  .markwrap svg { display: block; }
  .btn.google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px 16px;
                font-weight: 600; text-decoration: none; color: var(--text); }
  .gicon { display: inline-flex; background: #fff; border-radius: 50%; padding: 3px; }
  .btn.big { padding: 11px 20px; font-size: 15px; }
  .readprog { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .readprog .row.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .readprog .mono { font: 13px ui-monospace, Menlo, monospace; }
  .pbar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
  .pbar span { position: absolute; inset: 0 auto 0 0; width: 35%; border-radius: 4px; background: var(--accent);
               animation: pslide 1.4s ease-in-out infinite; }
  @keyframes pslide { from { left: -35%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .pbar span { animation: none; width: 100%; opacity: .5; } .dotpulse, .secs li.now .sectick::before { animation: none; } }
  .readpill { position: fixed; right: 18px; bottom: 18px; z-index: 15; display: flex; align-items: center; gap: 10px;
              max-width: min(420px, calc(100vw - 36px)); padding: 10px 14px; border-radius: 999px; cursor: pointer;
              background: var(--panel); color: var(--text); border: 1px solid var(--line); font: inherit; font-size: 14px;
              box-shadow: 0 8px 24px -8px rgba(0,0,0,.25); text-align: left; }
  .readpill > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .readpill:hover { border-color: var(--accent); }
  .dotpulse { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
  .secs { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; font-size: 14px; }
  .secs li { display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 2px; border-bottom: 1px solid var(--line); }
  .secs li:last-child { border-bottom: 0; }
  .secs .sectick { width: 16px; color: var(--ok, #2f8a4f); text-align: center; flex: none; }
  .secs li.now { font-weight: 650; }
  .secs li.now .sectick::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                               background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  details.pwlogin { margin-top: 16px; } details.pwlogin summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .card.wide { width: min(640px, 100%); }
  .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .kindcard { text-align: left; display: grid; gap: 4px; align-content: start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
              background: var(--panel); cursor: pointer; }
  .kindcard[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .kindcard:disabled { opacity: .55; cursor: not-allowed; }
  .kindcard .badge { justify-self: start; }
  .picker { font-weight: 650; font-size: 16px; border: 1px solid transparent; background: transparent; max-width: 60vw; }
  .picker:hover { border-color: var(--line); }
  .usermenu { position: relative; } .usermenu summary { list-style: none; cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
    background: var(--neutral-bg); display: grid; place-items: center; font-weight: 700; }
  .usermenu summary::-webkit-details-marker { display: none; }
  .usermenu .menu { position: absolute; right: 0; top: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; gap: 10px; min-width: 220px; box-shadow: var(--shadow); z-index: 10; }
  .row.wrap { flex-wrap: wrap; }
  .home { display: grid; gap: 12px; }
  .hello { font-size: 24px; margin: 4px 0 0; white-space: normal; overflow: visible; }
  ol.steps { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
  .step { display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .step h3 { margin: 0 0 4px; font-size: 16px; } .step p { margin: 0 0 10px; }
  .step.current { border-color: var(--accent); }
  .faq { display: flex; flex-direction: column; gap: 10px; }
  .faq-row { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .faq-row.drafted { border-color: var(--warn); }
  .faq-row .faq-q { font-weight: 600; }
  .faq-suggest .tags { margin-top: 6px; }
  .ocard .pickup { font-weight: 650; color: var(--accent); margin-top: 4px; }
  .daypick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .daypick .chip { min-width: 48px; justify-content: center; }
  .field.rules .switch { margin: 6px 0 10px; }
  /* analytics */
  :root { --chart: #b4441f; }
  @media (prefers-color-scheme: dark) { :root { --chart: #d46a43; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .kpi-label { font-size: 13px; color: var(--muted); }
  .kpi-value { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; margin-top: 14px; }
  .acard { margin-top: 14px; } .agrid .acard { margin-top: 0; }
  .acard h2 { margin: 0 0 4px; font-size: 16px; }
  .hbars { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .hbar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { height: 10px; border-radius: 4px; background: transparent; }
  .hbar-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--chart); }
  .hbar-value { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 3ch; text-align: right; }
  .vchart { margin-top: 8px; }
  .vbars { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--line); }
  .vbar { flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 3px; }
  .vbar:hover .vbar-fill { opacity: .75; }
  .vbar-fill { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--chart); }
  .vaxis { display: flex; gap: 2px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .vaxis span { flex: 1; text-align: center; white-space: nowrap; overflow: visible; }
  .quotes { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; }
  .quotes li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .quotes .q { flex: 1 1 60%; }
  .quotes .q .badge { margin-left: 8px; }
  .atable { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .atable th, .atable td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-weight: normal; }
  .atable td { text-align: right; font-variant-numeric: tabular-nums; }
  .atable.wide td:first-child, .atable.wide th:first-child { text-align: left; }
  .atable.wide th { color: var(--muted); font-size: 13px; text-align: right; }
  .atable tr.bad td { color: var(--bad); font-weight: 650; }
  .call-summary { display: block; margin-top: 4px; font-weight: normal; }
  .chip-incomplete { display: inline-block; margin-left: 10px; vertical-align: 2px; padding: 2px 9px; border-radius: 999px;
                     background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 650; }
  .missing-note { margin-bottom: 14px; }
  .missing-note a { color: inherit; text-decoration: underline; }
  .req-tag { display: none; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn);
             font-size: 11px; font-weight: 650; }
  .field.missing .req-tag { display: inline-block; }
  .field.missing input, .field.missing textarea { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .step.done h3 { color: var(--muted); } .step.done .sub { display: none; }
  .tick { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
          background: var(--neutral-bg); color: var(--muted); }
  .step.done .tick { background: var(--ok-bg); color: var(--ok); } .step.current .tick { background: var(--accent); color: var(--accent-text); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 13px; } .tile .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .liveline { display: grid; gap: 12px; }
  .bigphone { font-size: 30px; font-weight: 750; letter-spacing: .01em; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
  .orders, .calls { display: grid; gap: 10px; }
  .ocard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
  .ohead { display: flex; gap: 10px; align-items: baseline; }
  .olines { margin: 2px 0 4px; padding-left: 18px; font-size: 14px; }
  .who { font-weight: 600; }
  details.call summary { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .transcript { margin-top: 10px; display: grid; gap: 4px; font-size: 14px; }
  .transcript .role { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .transcript .line.tool, .transcript .line.event { color: var(--muted); font-size: 13px; }
  ul.people { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.people li { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .chatlog { display: grid; gap: 8px; align-content: start; min-height: 240px; max-height: 60vh; overflow-y: auto; padding: 4px 0 12px; }
  .msg { display: grid; gap: 3px; } .msg.caller { justify-items: end; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--neutral-bg); }
  .msg.caller .bubble { background: var(--accent); color: var(--accent-text); }
  .toolnote { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .chatform { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .item { grid-template-columns: 1fr auto; }
    .item .switch span { display: none; }
    .item .price { grid-column: 2; grid-row: 1; }
    .item .switch { grid-column: 2; grid-row: 2; justify-self: end; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const dlg = document.getElementById("dlg");
  const API = "/api/manage";
  // Words and tags for this kind of business come from its template (S.ed.template).
  const W = () => S.ed.template.words;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const SAVE_DELAY = 1200;

  // ---- tiny DOM helper (text is always set as text, never HTML) ----
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "class") n.className = v;
      else if (k === "value") n.value = v;
      else if (k === "checked") n.checked = !!v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
    return n;
  }
  const money = n => "$" + Number(n || 0).toFixed(2);
  const round2 = n => Math.round(Number(n) * 100) / 100;
  const ago = t => {
    const s = Math.max(0, Date.now() / 1000 - t);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(t * 1000).toLocaleDateString();
  };
  const fmtTime = t => new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  function toast(msg) {
    const t = el("div", { class: "toast", role: "status" }, msg);
    document.body.append(t);
    setTimeout(() => t.remove(), 3200);
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(method, path, body) {
    const opts = { method, headers: { "X-Manage": "1" }, credentials: "same-origin" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    const r = await fetch(API + path, opts);
    let data = null;
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      const e = new Error((data && data.detail) || ("Request failed (" + r.status + ")"));
      e.status = r.status; e.data = data;
      throw e;
    }
    return data;
  }

  // ---- state ----
  const S = {
    me: null, rid: null, ed: null,       // ed: editor state from the server
    catalog: null, revision: null,          // working copy and draft revision
    tab: "home", q: "", filter: "all", collapsed: new Set(), line: null, chat: null,
    dirty: false, saving: false, saveTimer: null, saveError: null, lastSaved: null,
    drawer: null,                        // {item, isNew}
    versions: null,
  };

  // ---- sign in ----
  let CONFIG = { google: false, password_login: true };
  const G_ICON = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
  function icon(svg) { const s = el("span", { class: "gicon" }); s.innerHTML = svg; return s; }  // constant markup only
  const BRAND = (document.querySelector('meta[name="application-name"]') || {}).content || document.title;
  const MARK = '<svg class="mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill:var(--accent)"/><path d="M11 20.5V11M11 15a5 5 0 0 1 5-5h1.5" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--accent-text)"/></svg>';
  const mark = () => { const s = el("span", { class: "markwrap" }); s.innerHTML = MARK; return s; };  // constant markup only
  const logo = () => el("a", { class: "wordmark", href: "/", "aria-label": BRAND }, BRAND);

  function screen(...kids) { app.replaceChildren(el("div", { class: "center" }, el("div", { class: "panel card" }, ...kids))); }

  function showLogin(msg) {
    const err = el("div", { class: "err", role: "alert" }, msg || "");
    const kids = [logo(), el("h2", { style: "margin-top:18px" }, "Sign in"),
      el("p", { class: "sub" }, "Manage your phone agent: orders, calls, what you sell and how it answers.")];
    if (CONFIG.google) kids.push(el("a", { class: "btn google", href: "/auth/google" }, icon(G_ICON), "Continue with Google"),
      el("p", { class: "sub", style: "margin-top:12px" }, "New here? Signing in creates your account."));
    if (CONFIG.password_login) {
      const email = el("input", { type: "email", id: "email", autocomplete: "username", required: true });
      const pw = el("input", { type: "password", id: "pw", autocomplete: "current-password", required: true });
      const submit = el("button", { class: "btn primary", type: "submit" }, "Sign in");
      const form = el("form", { onsubmit: async e => {
          e.preventDefault(); submit.disabled = true; err.textContent = "";
          try { await api("POST", "/login", { email: email.value, password: pw.value }); boot(); }
          catch (x) { err.textContent = x.message; submit.disabled = false; }
        } },
        el("div", { class: "field" }, el("label", { for: "email" }, "Email"), email),
        el("div", { class: "field" }, el("label", { for: "pw" }, "Password"), pw), el("div", { class: "row" }, submit));
      kids.push(CONFIG.google ? el("details", { class: "pwlogin" }, el("summary", {}, "Use email and password instead"), form) : form);
    }
    kids.push(err);
    screen(...kids);
  }

  function showInvite(token) {
    const name = el("input", { type: "text", id: "nm", autocomplete: "name" });
    const pw = el("input", { type: "password", id: "pw1", autocomplete: "new-password", minlength: 10, required: true });
    const pw2 = el("input", { type: "password", id: "pw2", autocomplete: "new-password", required: true });
    const err = el("div", { class: "err", role: "alert" });
    const submit = el("button", { class: "btn primary", type: "submit" }, "Set password and sign in");
    screen(el("form", {
      onsubmit: async e => {
        e.preventDefault(); err.textContent = "";
        if (pw.value !== pw2.value) { err.textContent = "The passwords don't match."; return; }
        submit.disabled = true;
        try {
          await api("POST", "/accept-invite", { token, password: pw.value, name: name.value });
          history.replaceState(null, "", location.pathname);
          boot();
        } catch (x) { err.textContent = x.message; submit.disabled = false; }
      }
    },
      logo(), el("h2", { style: "margin-top:18px" }, "Welcome"),
      el("p", { class: "sub" }, "Choose a password. Use at least 10 characters."),
      el("div", { class: "field" }, el("label", { for: "nm" }, "Your name"), name),
      el("div", { class: "field" }, el("label", { for: "pw1" }, "Password"), pw),
      el("div", { class: "field" }, el("label", { for: "pw2" }, "Password again"), pw2),
      err, submit));
    name.focus();
  }

  async function boot() {
    try { CONFIG = await api("GET", "/config"); } catch {}
    const m = location.hash.match(/invite=([\w-]+)/);
    if (m) return showInvite(m[1]);
    try { S.me = await api("GET", "/me"); }
    catch (e) { if (e.status === 401) return showLogin(); return screen(el("p", {}, e.message)); }
    if (!S.me.businesses.length) return showCreate(true);
    const saved = Number(store.get("manage.business"));
    S.rid = S.me.businesses.some(r => r.id === saved) ? saved : S.me.businesses[0].id;
    await loadEditor();
  }

  // ---- create a business ----
  async function showCreate(first) {
    let templates = [];
    try { templates = await api("GET", "/templates"); } catch (e) { return screen(el("p", {}, e.message)); }
    let chosen = (templates.find(t => t.status === "available") || {}).id;
    const name = el("input", { type: "text", id: "bname", maxlength: 80, placeholder: "e.g. Rosa's Bakery", required: true });
    const err = el("div", { class: "err", role: "alert" });
    const cards = el("div", { class: "kinds", role: "radiogroup", "aria-label": "Type of business" });
    const drawCards = () => cards.replaceChildren(...templates.map(t => {
      const soon = t.status !== "available";
      return el("button", { type: "button", class: "kindcard", role: "radio", "aria-checked": t.id === chosen ? "true" : "false",
        disabled: soon || null, onclick: () => { chosen = t.id; drawCards(); } },
        el("strong", {}, t.label.replace(" (coming soon)", "")), soon ? el("span", { class: "badge" }, "Coming soon") : null,
        el("span", { class: "sub" }, t.description));
    }));
    drawCards();
    const submit = el("button", { class: "btn primary big", type: "submit" }, "Create my phone agent");
    screen(el("form", { onsubmit: async e => {
        e.preventDefault(); err.textContent = ""; submit.disabled = true;
        try {
          let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch {}
          const r = await api("POST", "/businesses", { name: name.value, template: chosen, timezone: tz });
          S.me = await api("GET", "/me"); S.rid = r.id; store.set("manage.business", r.id); S.tab = "home";
          await loadEditor();
        } catch (x) { err.textContent = x.message; submit.disabled = false; }
      } },
      logo(),
      el("h2", { style: "margin-top:18px" }, first ? "Let's set up your phone agent" : "Add a business"),
      el("p", { class: "sub" }, "It takes about ten minutes. You can change everything later."),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "What kind of business is it?"), cards),
      el("div", { class: "field" }, el("label", { for: "bname" }, "Business name"), name),
      err, el("div", { class: "row", style: "justify-content:space-between" },
        first ? signOutBtn() : el("button", { class: "btn", type: "button", onclick: () => loadEditor() }, "Cancel"), submit)));
    app.querySelector(".card").classList.add("wide");
    name.focus();
  }

  async function loadEditor() {
    app.replaceChildren(el("div", { class: "center" }, el("p", { class: "muted" }, "Loading…")));
    S.ed = await api("GET", `/businesses/${S.rid}/editor`);
    S.catalog = structuredClone(S.ed.catalog || { settings: { name: "" }, items: [] });
    S.revision = S.ed.draft ? S.ed.draft.revision : null;
    S.dirty = false; S.saveError = null; S.versions = null; S.drawer = null; S.line = null; S.chat = null;
    render();
    renderReadingPill();
    if (!S.reading) {  // a reading started before a reload, or in another tab
      const bid = S.rid;
      api("GET", `/businesses/${bid}/import`).then(r => { if (r.job && !S.reading) followReading(bid, r.job, null); }).catch(() => {});
    }
  }

  // ---- saving ----
  function changed(rerender = true) {
    S.dirty = true; S.saveError = null;
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(saveDraft, SAVE_DELAY);
    if (rerender) render(); else renderHeader();
  }

  async function saveDraft() {
    if (S.saving) { S.saveTimer = setTimeout(saveDraft, 400); return; }
    if (!S.dirty) return;
    S.saving = true; S.dirty = false; renderHeader();
    try {
      const r = await api("PUT", `/businesses/${S.rid}/draft`, { catalog: S.catalog, revision: S.revision });
      S.revision = r.revision; S.ed.check = r.check; S.lastSaved = Date.now() / 1000;
      if (!S.ed.draft) S.ed.draft = { revision: r.revision, live_changed: false, updated_by: S.me.who };
      S.ed.draft.revision = r.revision;
    } catch (e) {
      S.dirty = true;
      S.saveError = e.message;
      if (e.status === 409) conflict(e.message);
      else if (e.status === 401) showLogin("You were signed out. Sign in again; unsaved edits on this page are lost.");
    } finally {
      S.saving = false;
      if (S.ed) { renderHeader(); renderChecks(); }
    }
  }

  async function flush() {
    clearTimeout(S.saveTimer);
    if (S.dirty) await saveDraft();
    while (S.saving) await new Promise(r => setTimeout(r, 100));
    if (S.saveError) throw new Error(S.saveError);
  }

  window.addEventListener("beforeunload", e => { if (S.dirty || S.saving) { e.preventDefault(); e.returnValue = ""; } });

  function conflict(msg) {
    ask({ title: `Someone else changed this ${W().catalog}`, body: msg + " Your last few edits weren't saved.",
          ok: "Reload", cancel: null }).then(loadEditor);
  }

  async function publish() {
    try { await flush(); } catch (e) { return toast("Couldn't save: " + e.message); }
    const c = S.ed.check || {};
    if (c.errors && c.errors.length) return toast("Fix the items marked “Fix before publishing” first.");
    const lines = [];
    if (c.blockers && c.blockers.length) lines.push("Still to confirm: " + c.blockers.join(" · "));
    const live = S.line && S.line.phone_number;
    const ok = await ask({ title: "Publish these changes?",
      body: (live ? `Callers will hear the new ${W().catalog} from the next call. ` : "This is the version your agent will use. ") + lines.join(" "),
      ok: "Publish" });
    if (!ok) return;
    let overwrite = false;
    for (;;) {
      try {
        const r = await api("POST", `/businesses/${S.rid}/publish`, { revision: S.revision, overwrite });
        S.ed = r; S.catalog = structuredClone(r.catalog); S.revision = null; S.versions = null; S.line = null;
        toast(live ? `Published. The next call uses the new ${W().catalog}.` : "Published.");
        return render();
      } catch (e) {
        if (e.status === 409 && e.data && e.data.code === "live_changed") {
          const yes = await ask({ title: `A newer ${W().catalog} was published`,
            body: `Someone published a ${W().catalog} after you started this draft. Publishing yours replaces it.`, ok: "Publish mine anyway" });
          if (!yes) return;
          overwrite = true; continue;
        }
        if (e.status === 409) return conflict(e.message);
        if (e.status === 422) { S.ed.check = e.data.check; render(); return toast("Fix the items marked “Fix before publishing” first."); }
        return toast(e.message);
      }
    }
  }

  async function discard() {
    const ok = await ask({ title: "Discard all unpublished changes?", body: `The ${W().catalog} goes back to the published version.`, ok: "Discard", danger: true });
    if (!ok) return;
    clearTimeout(S.saveTimer); S.dirty = false;
    try { S.ed = await api("DELETE", `/businesses/${S.rid}/draft`); } catch (e) { return toast(e.message); }
    S.catalog = structuredClone(S.ed.catalog); S.revision = null;
    render();
  }

  // Before the first publish: wipe everything back to a fresh business (name and type kept).
  const canStartOver = () => !S.ed.live_catalog_id && isOwner();
  async function startOver() {
    const n = S.catalog.items.length;
    const ok = await ask({ title: "Start over?",
      body: `This clears your ${W().catalog}${n ? ` (${n === 1 ? `1 ${W().item}` : `all ${n} ${W().items}`})` : ""} and every detail you've set, like tax, hours and notes. Your business name and type stay. This can't be undone.`,
      ok: "Start over", danger: true });
    if (!ok) return;
    clearTimeout(S.saveTimer);
    try { await flush(); } catch {}
    try { S.ed = await api("POST", `/businesses/${S.rid}/start-over`, { revision: S.revision }); }
    catch (e) { return toast(e.message); }
    S.catalog = structuredClone(S.ed.catalog); S.revision = S.ed.draft ? S.ed.draft.revision : null;
    S.dirty = false; S.tab = "home"; render();
    toast("Started over. Everything is back to how it was when you created the business.");
  }
  function startOverPanel() {
    if (!canStartOver()) return null;
    return el("section", { class: "panel", style: "margin-top:14px" },
      el("h2", {}, "Start over"),
      el("p", { class: "sub" }, `Until you publish, you can clear everything (your ${W().catalog} and all details) and set it up again from scratch.`),
      el("button", { class: "btn danger", type: "button", onclick: startOver }, "Start over…"));
  }

  // ---- dialogs ----
  function ask({ title, body, ok = "OK", cancel = "Cancel", danger = false, input = null }) {
    return new Promise(resolve => {
      const field = input ? el("input", { type: "text", value: input.value || "", style: "width:100%", "aria-label": title }) : null;
      const done = v => { dlg.close(); resolve(v); };
      dlg.replaceChildren(el("form", { method: "dialog", onsubmit: e => { e.preventDefault(); done(field ? field.value.trim() : true); } },
        el("h2", {}, title), body ? el("p", { class: "sub", style: "white-space:pre-line" }, body) : null, field,
        el("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" },
          cancel ? el("button", { class: "btn", type: "button", onclick: () => done(null) }, cancel) : null,
          el("button", { class: "btn " + (danger ? "danger" : "primary"), type: "submit" }, ok))));
      dlg.onclose = () => resolve(null);
      dlg.showModal();
      if (field) { field.focus(); field.select(); }
    });
  }

  // A panel that slides in from the right (test chat, reading a menu). Returns its body element.
  function sidePanel(title, onClose) {
    document.querySelectorAll(".side, .side-bg").forEach(n => n.remove());
    const close = () => { document.querySelectorAll(".side, .side-bg").forEach(n => n.remove()); if (onClose) onClose(); };
    const body = el("div", { class: "drawer-body" });
    const panel = el("aside", { class: "drawer side", role: "dialog", "aria-modal": "true", "aria-label": title,
                                onkeydown: e => { if (e.key === "Escape") close(); } },
      el("div", { class: "drawer-head" }, el("h2", { style: "margin:0" }, title),
        el("button", { class: "btn small", onclick: close, "aria-label": "Close" }, "✕")), body);
    document.body.append(el("div", { class: "drawer-bg side-bg", onclick: close }), panel);
    return { body, panel, close };
  }

  // ---- layout ----
  function signOutBtn() {
    return el("button", { class: "btn small", type: "button", onclick: async () => {
      try { await flush(); } catch {}
      try { await api("POST", "/logout"); } catch {}
      S.me = null; showLogin("Signed out.");
    } }, "Sign out");
  }

  let refreshTimer = null;
  const TABS = () => [["home", "Home"], ["orders", "Orders"], ["calls", "Calls"], ["insights", "Insights"], ["catalog", cap(W().catalog)],
    ["settings", "Settings"], ["team", "Team"], ["history", "History"]]
    .concat(S.me.operator ? [["analytics", "Analytics"], ["operator", "Operator"]] : []);

  function render() {
    clearInterval(refreshTimer);
    const businesses = S.me.businesses;
    const picker = el("select", { class: "picker", "aria-label": "Business", onchange: async e => {
      if (e.target.value === "new") { e.target.value = S.rid; try { await flush(); } catch {} return showCreate(false); }
      try { await flush(); } catch (x) { return toast("Couldn't save: " + x.message); }
      S.rid = Number(e.target.value); store.set("manage.business", S.rid); S.tab = "home"; loadEditor();
    } }, businesses.map(r => el("option", { value: r.id, selected: r.id === S.rid }, r.name)),
      el("option", { value: "new" }, "+ Add a business"));
    if (!TABS().some(([k]) => k === S.tab)) S.tab = "home";

    app.replaceChildren(
      el("header", {},
        el("div", { class: "brand" }, mark(), picker),
        el("div", { class: "actions", id: "hdr" })),
      el("main", {},
        el("nav", { class: "tabs", role: "tablist" },
          TABS().map(([k, label]) => el("button", { role: "tab", "aria-selected": S.tab === k ? "true" : "false",
            onclick: () => { S.tab = k; render(); trackPage(k); } }, label))),
        el("div", { class: "checks", id: "checks" }),
        el("div", { id: "view" })));
    renderHeader(); renderChecks();
    const view = document.getElementById("view");
    const views = { home: homeView, orders: ordersView, calls: callsView, catalog: catalogView, settings: settingsView,
                    team: teamView, history: historyView, operator: operatorView,
                    insights: () => analyticsView(false), analytics: () => analyticsView(true) };
    view.append(views[S.tab]());
    if (S.drawer) renderDrawer();
  }

  function renderHeader() {
    const hdr = document.getElementById("hdr");
    if (!hdr) return;
    const hasDraft = !!S.ed.draft || S.dirty;
    let status = null;
    if (S.saveError) status = el("span", { class: "status bad", title: S.saveError }, "Not saved");
    else if (S.saving || S.dirty) status = el("span", { class: "status draft" }, "Saving…");
    else if (hasDraft) status = el("span", { class: "status draft",
      title: S.ed.draft && S.ed.draft.updated_by ? "Last edit by " + S.ed.draft.updated_by : "" },
      "Unpublished changes" + (S.lastSaved ? " · saved " + ago(S.lastSaved) : ""));
    const errors = (S.ed.check && S.ed.check.errors.length) || 0;
    const user = el("details", { class: "usermenu" }, el("summary", { "aria-label": "Account" }, (S.me.email || S.me.who || "?")[0].toUpperCase()),
      el("div", { class: "menu" }, el("div", { class: "sub" }, S.me.email || S.me.who), signOutBtn()));
    hdr.replaceChildren(...[status,
      hasDraft && S.ed.live_catalog_id ? el("button", { class: "btn small", onclick: discard }, "Discard") : null,
      hasDraft ? el("button", { class: "btn primary", disabled: errors > 0 || null,
                                title: errors ? "Fix the errors first" : "", onclick: publish }, "Publish") : null,
      user].filter(Boolean));
  }

  function renderChecks() {
    const box = document.getElementById("checks");
    if (!box) return;
    if (!["catalog", "settings"].includes(S.tab)) return box.replaceChildren();
    const c = S.ed.check;
    const parts = [];
    if (S.ed.draft && S.ed.draft.live_changed)
      parts.push(el("div", { class: "note warn" }, `A newer ${W().catalog} was published after this draft was started. Publishing this draft will replace it; discard the draft to start from the newest one.`));
    if (c && c.errors.length) parts.push(el("div", { class: "note bad", role: "alert" },
      el("strong", {}, "Fix before publishing"), el("ul", {}, c.errors.map(m => el("li", {}, m)))));
    if (c && c.blockers.length) parts.push(el("div", { class: "note warn" },
      el("strong", {}, "Please confirm"), el("ul", {}, c.blockers.map(m => el("li", {}, m)))));
    if (c && c.warnings.length) {
      const d = el("details", { class: "note info" }, el("summary", {}, `${c.warnings.length} suggestion${c.warnings.length > 1 ? "s" : ""}`),
        el("ul", {}, c.warnings.map(m => el("li", {}, m))));
      parts.push(d);
    }
    if (S.ed.pos_provider) parts.push(el("div", { class: "note info" },
      `Orders go to ${cap(S.ed.pos_provider)}. Items linked to it use the POS's own prices on the POS; change prices there too.`));
    box.replaceChildren(...parts);
  }

  // ---- catalog tab ----
  const isEstimated = it => !!it.placeholder_price;
  const DAYS = [["mon", "Mon"], ["tue", "Tue"], ["wed", "Wed"], ["thu", "Thu"], ["fri", "Fri"], ["sat", "Sat"], ["sun", "Sun"]];
  // Short labels for an item's ordering rules (same meaning as schedule.py).
  function ruleBadges(it) {
    const out = [];
    if (it.in_person_only) out.push("In person only");
    const d = it.days || [];
    if (d.length && d.length < 7) out.push(d.length === 2 && d.includes("sat") && d.includes("sun") ? "Weekends only"
      : d.length === 5 && !d.includes("sat") && !d.includes("sun") ? "Weekdays only"
      : DAYS.filter(([k]) => d.includes(k)).map(([, l]) => l).join(", ") + " only");
    if (it.notice_days) out.push(it.notice_days === 1 ? "1 day notice" : `${it.notice_days} days notice`);
    return out;
  }
  const isOff = it => it.available === false;

  function catalogView() {
    const items = S.catalog.items;
    const q = S.q.trim().toLowerCase();
    const shown = items.filter(it =>
      (!q || (it.name + " " + (it.description || "") + " " + it.category).toLowerCase().includes(q)) &&
      (S.filter === "all" || (S.filter === "off" && isOff(it)) || (S.filter === "est" && isEstimated(it))));
    const cats = [];
    const byCat = new Map();
    for (const it of shown) {
      if (!byCat.has(it.category)) { byCat.set(it.category, []); cats.push(it.category); }
      byCat.get(it.category).push(it);
    }
    const search = el("input", { type: "search", placeholder: "Search " + W().items, value: S.q, "aria-label": "Search " + W().items,
      oninput: e => { S.q = e.target.value; const v = document.getElementById("view"); v.replaceChildren(catalogView());
                      const s = v.querySelector("input[type=search]"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
    const chip = (k, label) => el("button", { class: "chip", "aria-pressed": S.filter === k ? "true" : "false",
      onclick: () => { S.filter = k; render(); } }, label);
    const nOff = items.filter(isOff).length, nEst = items.filter(isEstimated).length;
    return el("div", {},
      el("div", { class: "toolbar" }, search, chip("all", `All ${items.length}`),
        nOff ? chip("off", `${W().unavailable_short} ${nOff}`) : null, nEst ? chip("est", `Estimated price ${nEst}`) : null,
        el("span", { class: "grow" }),
        el("button", { class: "btn", onclick: openImport }, "Read from a link, photos or PDF"),
        el("button", { class: "btn primary", onclick: () => openItem(null) }, "+ Add " + W().item)),
      cats.length ? cats.map(cat => categoryBlock(cat, byCat.get(cat), !!q || S.filter !== "all"))
        : el("div", { class: "empty" }, items.length ? `No ${W().items} match.` : `No ${W().items} yet. Add your first one.`));
  }

  function categoryBlock(cat, items, forceOpen) {
    const open = forceOpen || !S.collapsed.has(cat);
    return el("section", { class: "cat" },
      el("div", { class: "cat-head" },
        el("button", { class: "linkish", "aria-expanded": open ? "true" : "false",
          onclick: () => { open ? S.collapsed.add(cat) : S.collapsed.delete(cat); render(); } }, open ? "▾" : "▸"),
        el("h3", {}, cat), el("span", { class: "sub" }, items.length),
        el("button", { class: "linkish", onclick: () => renameCategory(cat) }, "Rename")),
      open ? el("div", { class: "items" }, items.map(itemRow)) : null);
  }

  function itemRow(it) {
    const toggle = el("label", { class: "switch", onclick: e => e.stopPropagation() },
      el("input", { type: "checkbox", checked: !isOff(it), "aria-label": `${it.name} available`,
        onchange: e => { if (e.target.checked) delete it.available; else it.available = false; changed(); } }),
      el("span", {}, isOff(it) ? W().unavailable_short : "Available"));
    const opts = Object.keys(it.options || {}).length, extras = Object.keys(it.extras || {}).length;
    return el("div", { class: "item" + (isOff(it) ? " off" : ""), tabindex: 0, role: "button",
                       onclick: () => openItem(it), onkeydown: e => { if (e.key === "Enter") openItem(it); } },
      el("div", { class: "main" },
        el("div", { class: "name" }, it.name),
        it.description ? el("div", { class: "desc" }, it.description) : null,
        (opts || extras || isEstimated(it) || isOff(it) || it.pos || ruleBadges(it).length) ? el("div", { class: "badges" },
          isOff(it) ? el("span", { class: "badge bad" }, W().unavailable_short) : null,
          isEstimated(it) ? el("span", { class: "badge warn" }, "Estimated price") : null,
          it.rules_from_menu ? el("span", { class: "badge warn" }, "Check rules") : null,
          ruleBadges(it).map(b => el("span", { class: "badge" }, b)),
          opts ? el("span", { class: "badge" }, opts + (opts > 1 ? " choices" : " choice")) : null,
          extras ? el("span", { class: "badge" }, extras + (extras > 1 ? " extras" : " extra")) : null,
          it.pos ? el("span", { class: "badge ok" }, "POS") : null) : null),
      el("div", { class: "price" }, money(it.price)), toggle);
  }

  async function renameCategory(cat) {
    const name = await ask({ title: "Rename " + W().section, body: `Renames "${cat}" for every ${W().item} in it.`, ok: "Rename", input: { value: cat } });
    if (!name || name === cat) return;
    S.catalog.items.forEach(it => { if (it.category === cat) it.category = name; });
    changed();
  }

  // ---- item drawer ----
  const slug = s => (s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "item");

  function openItem(it) {
    S.drawer = it ? { item: it, isNew: false }
      : { item: { name: "", category: S.catalog.items.length ? S.catalog.items[S.catalog.items.length - 1].category : "", price: 0, description: "" }, isNew: true };
    renderDrawer();
  }
  function closeDrawer() {
    S.drawer = null;
    document.querySelectorAll(".drawer, .drawer-bg").forEach(n => n.remove());
    render();
  }

  function renderDrawer() {
    const oldBody = document.querySelector(".drawer-body");
    const top = oldBody ? oldBody.scrollTop : 0;
    const focusId = document.activeElement && document.activeElement.id;
    document.querySelectorAll(".drawer, .drawer-bg").forEach(n => n.remove());
    const { item: it, isNew } = S.drawer;
    // Edits to existing dishes are live (autosaved to the draft); a new dish is added on "Add".
    const edit = (structural = false) => {
      if (!isNew) { changed(false); refreshListQuietly(); }
      if (structural) renderDrawer();
    };
    const categories = [...new Set(S.catalog.items.map(i => i.category))];
    const tags = el("div", { class: "tags" }, S.ed.template.tags.map(tag => {
      const on = (it.description || "").includes(tag);
      return el("button", { class: "chip", type: "button", "aria-pressed": on ? "true" : "false", onclick: () => {
        let d = (it.description || "").replace(tag, "").replace(/\s{2,}/g, " ").trim();
        if (!on) d = (d ? d + " " : "") + tag;
        it.description = d; edit(true);
      } }, tag.replace(".", ""));
    }));
    const body = el("div", { class: "drawer-body" },
      el("div", { class: "field" }, el("label", { for: "f-name" }, "Name"),
        el("input", { id: "f-name", type: "text", value: it.name, maxlength: 80, oninput: e => { it.name = e.target.value; edit(); } }),
        el("span", { class: "help" }, `As callers would say it. Make it distinct from similar ${W().items}.`)),
      el("div", { class: "row" },
        el("div", { class: "field grow" }, el("label", { for: "f-cat" }, cap(W().section)),
          el("input", { id: "f-cat", type: "text", list: "cats", value: it.category, maxlength: 100,
                        oninput: e => { it.category = e.target.value; edit(); } }),
          el("datalist", { id: "cats" }, categories.map(c => el("option", { value: c })))),
        el("div", { class: "field" }, el("label", { for: "f-price" }, "Price"),
          moneyInput(it.price, v => { it.price = v; delete it.placeholder_price; edit(); }, "f-price"))),
      isEstimated(it) ? el("div", { class: "placeholder" }, "This price was estimated. Change it, or confirm it's right.",
        el("button", { class: "btn small", type: "button", onclick: () => { delete it.placeholder_price; edit(true); } }, "It's right")) : null,
      el("div", { class: "field" }, el("label", { for: "f-desc" }, "Description"),
        el("textarea", { id: "f-desc", rows: 3, maxlength: 400, oninput: e => { it.description = e.target.value; edit(); } }, it.description || ""),
        el("span", { class: "help" }, "Short. The agent uses it to answer questions. Tap tags to add them:"), tags),
      el("div", { class: "field" },
        el("label", { class: "switch", style: "color:inherit" },
          el("input", { type: "checkbox", checked: !isOff(it), onchange: e => { if (e.target.checked) delete it.available; else it.available = false; edit(true); } }),
          el("span", {}, isOff(it) ? `${W().unavailable_short}: the agent says it's unavailable` : "Available to order"))),
      rulesEditor(it, edit),
      optionsEditor(it, edit),
      extrasEditor(it, edit),
      !isNew ? el("p", { class: "sub" }, `${cap(W().item)} id: ${it.id}` + (it.pos ? " · linked to the POS" : "")) : null);

    const foot = el("div", { class: "drawer-foot" },
      isNew ? el("span") : el("button", { class: "btn danger", type: "button", onclick: async () => {
        if (!await ask({ title: `Delete "${it.name}"?`, body: "Callers won't be able to order it once you publish.", ok: "Delete", danger: true })) return;
        S.catalog.items.splice(S.catalog.items.indexOf(it), 1);
        changed(false); closeDrawer();
      } }, "Delete " + W().item),
      el("div", { class: "row" },
        el("button", { class: "btn", type: "button", onclick: closeDrawer }, isNew ? "Cancel" : "Done"),
        isNew ? el("button", { class: "btn primary", type: "button", onclick: () => {
          if (!it.name.trim()) return toast(`Give the ${W().item} a name.`);
          if (!it.category.trim()) return toast(`Choose a ${W().section}.`);
          if (!(it.price > 0)) return toast("Set a price.");
          const ids = new Set(S.catalog.items.map(i => i.id));
          let id = slug(it.name), n = 2;
          while (ids.has(id)) id = slug(it.name) + "_" + n++;
          S.catalog.items.push({ id, ...it });
          S.drawer = null; changed(); toast(`Added "${it.name}".`);
        } }, "Add " + W().item) : null));

    const bg = el("div", { class: "drawer-bg", onclick: closeDrawer });
    const drawer = el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": isNew ? "New " + W().item : it.name,
                                 onkeydown: e => { if (e.key === "Escape") closeDrawer(); } },
      el("div", { class: "drawer-head" }, el("h2", { style: "margin:0" }, isNew ? "New " + W().item : "Edit " + W().item),
        el("button", { class: "btn small", onclick: closeDrawer, "aria-label": "Close" }, "✕")),
      body, foot);
    document.body.append(bg, drawer);
    body.scrollTop = top;
    const f = focusId && document.getElementById(focusId);
    (f || drawer.querySelector("input")).focus();
  }

  let listTimer = null;
  function refreshListQuietly() {  // update the list behind the drawer without stealing focus
    clearTimeout(listTimer);
    listTimer = setTimeout(() => {
      const v = document.getElementById("view");
      if (v && S.tab === "catalog") v.replaceChildren(catalogView());
    }, 300);
  }

  function moneyInput(value, onset, id) {
    return el("span", { class: "money" }, el("span", {}, "$"),
      el("input", { id, type: "number", min: 0, step: "0.01", inputmode: "decimal", value: Number(value || 0).toFixed(2),
                    oninput: e => { const v = parseFloat(e.target.value); onset(isFinite(v) ? round2(v) : 0); } }));
  }

  // When it can be ordered: days of the week, days of notice, in person only.
  function rulesEditor(it, edit) {
    const touch = () => { delete it.rules_from_menu; };
    const days = new Set(it.days && it.days.length ? it.days : DAYS.map(([k]) => k));
    const setDays = () => {
      const list = DAYS.map(([k]) => k).filter(k => days.has(k));
      if (list.length === 7 || !list.length) delete it.days; else it.days = list;
      touch(); edit(true);
    };
    const sameSection = S.catalog.items.filter(o => o !== it && o.category === it.category);
    return el("div", { class: "field rules" },
      el("span", { class: "lbl" }, "When it can be ordered"),
      it.rules_from_menu ? el("div", { class: "placeholder" }, `These rules were read from your ${W().catalog}. Check them, or confirm they're right.`,
        el("button", { class: "btn small", type: "button", onclick: () => { touch(); edit(true); } }, "They're right")) : null,
      el("label", { class: "switch", style: "color:inherit" },
        el("input", { type: "checkbox", checked: !!it.in_person_only,
          onchange: e => { if (e.target.checked) it.in_person_only = true; else delete it.in_person_only; touch(); edit(true); } }),
        el("span", {}, "In person only")),
      el("span", { class: "help", style: "margin-top:-6px" }, it.in_person_only
        ? "Callers can ask about it, but the agent won't take it on a phone order."
        : "Turn on for things sold only at the counter, like bar drinks."),
      it.in_person_only ? null : el("div", {},
        el("span", { class: "help" }, "Days it can be picked up"),
        el("div", { class: "daypick", role: "group", "aria-label": "Days it can be picked up" },
          DAYS.map(([k, label]) => el("button", { type: "button", class: "chip", "aria-pressed": days.has(k) ? "true" : "false",
            onclick: () => { days.has(k) ? days.delete(k) : days.add(k); if (!days.size) return toast("Pick at least one day."); setDays(); } }, label))),
        el("div", { class: "row", style: "margin-top:10px;align-items:center" },
          el("label", { for: "f-notice", class: "help", style: "margin:0" }, "Order at least"),
          el("input", { id: "f-notice", type: "number", min: 0, max: 30, step: 1, style: "max-width:80px", value: it.notice_days || 0,
            oninput: e => { const n = parseInt(e.target.value, 10); if (n > 0) it.notice_days = Math.min(n, 30); else delete it.notice_days; touch(); edit(); } }),
          el("span", { class: "help", style: "margin:0" }, "days ahead (0: same day)"))),
      sameSection.length && (it.days || it.notice_days || it.in_person_only) ? el("button", { class: "linkish", type: "button", onclick: async () => {
        const ok = await ask({ title: `Use these rules for all of ${it.category}?`,
          body: `The other ${sameSection.length} ${sameSection.length === 1 ? W().item : W().items} in ${it.category} get the same days, notice and in-person setting.`, ok: "Apply" });
        if (!ok) return;
        for (const o of sameSection) {
          for (const k of ["days", "notice_days", "in_person_only"]) { if (it[k]) o[k] = Array.isArray(it[k]) ? [...it[k]] : it[k]; else delete o[k]; }
          delete o.rules_from_menu;
        }
        changed(false); refreshListQuietly(); toast(`Updated ${sameSection.length} ${W().items}.`);
      } }, `Use these rules for everything in ${it.category}`) : null);
  }

  function optionsEditor(it, edit) {
    const opts = it.options || {};
    let n = 0;
    return el("div", { class: "field" },
      el("span", { class: "lbl" }, "Choices"),
      el("span", { class: "help" }, `Things the caller picks, like size or flavor. Price is added to the ${W().item} price; the cheapest should be $0.`),
      Object.entries(opts).map(([name, grp]) => {
        const gid = "g" + (n++);
        const rename = v => {
          const entries = Object.entries(it.options).map(([k, g]) => [k === name ? v : k, g]);
          it.options = Object.fromEntries(entries);
        };
        return el("div", { class: "group" },
          el("div", { class: "row" },
            el("input", { id: gid + "-n", type: "text", class: "grow", value: name, "aria-label": "Choice name", placeholder: "e.g. size",
                          onchange: e => { const v = e.target.value.trim(); if (v && v !== name && !(v in it.options)) { rename(v); edit(true); } } }),
            el("label", { class: "switch" }, el("input", { type: "checkbox", checked: !!grp.required,
              onchange: e => { grp.required = e.target.checked; edit(); } }), el("span", {}, "Must choose")),
            el("button", { class: "btn small danger", type: "button", "aria-label": "Remove " + name,
              onclick: () => { delete it.options[name]; if (!Object.keys(it.options).length) delete it.options; edit(true); } }, "✕")),
          Object.entries(grp.choices).map(([choice, delta], ci) => el("div", { class: "row" },
            el("input", { id: `${gid}-c${ci}`, type: "text", class: "grow", value: choice, "aria-label": "Option",
              onchange: e => {
                const v = e.target.value.trim();
                if (!v || v === choice || v in grp.choices) return;
                grp.choices = Object.fromEntries(Object.entries(grp.choices).map(([k, d]) => [k === choice ? v : k, d]));
                edit(true);
              } }),
            moneyInput(delta, v => { grp.choices[choice] = v; edit(); }, `${gid}-p${ci}`),
            el("button", { class: "btn small", type: "button", "aria-label": "Remove " + choice,
              onclick: () => { delete grp.choices[choice]; edit(true); } }, "✕"))),
          el("button", { class: "linkish", type: "button", onclick: async () => {
            const v = await ask({ title: "Add an option", ok: "Add", input: { value: "" } });
            if (v && !(v in grp.choices)) { grp.choices[v] = 0; edit(true); }
          } }, "+ Add option"));
      }),
      el("button", { class: "btn small", type: "button", onclick: async () => {
        const v = await ask({ title: "New choice", body: "What does the caller choose? e.g. size, flavor, color", ok: "Add", input: { value: "" } });
        if (!v) return;
        it.options = it.options || {};
        if (v in it.options) return toast("That choice already exists.");
        it.options[v] = { choices: {}, required: true };
        edit(true);
      } }, "+ Add a choice"));
  }

  function extrasEditor(it, edit) {
    const extras = it.extras || {};
    return el("div", { class: "field" },
      el("span", { class: "lbl" }, "Extras"),
      el("span", { class: "help" }, "Optional add-ons, each with its price."),
      Object.entries(extras).map(([name, price], i) => el("div", { class: "row" },
        el("input", { id: "x" + i, type: "text", class: "grow", value: name, "aria-label": "Extra",
          onchange: e => {
            const v = e.target.value.trim();
            if (!v || v === name || v in it.extras) return;
            it.extras = Object.fromEntries(Object.entries(it.extras).map(([k, p]) => [k === name ? v : k, p]));
            edit(true);
          } }),
        moneyInput(price, v => { it.extras[name] = v; edit(); }, "xp" + i),
        el("button", { class: "btn small", type: "button", "aria-label": "Remove " + name,
          onclick: () => { delete it.extras[name]; if (!Object.keys(it.extras).length) delete it.extras; edit(true); } }, "✕"))),
      el("button", { class: "btn small", type: "button", onclick: async () => {
        const v = await ask({ title: "Add an extra", body: "e.g. extra cheese", ok: "Add", input: { value: "" } });
        if (!v) return;
        it.extras = it.extras || {};
        if (!(v in it.extras)) it.extras[v] = 0;
        edit(true);
      } }, "+ Add an extra"));
  }

  // ---- settings tab (built from the server's schema) ----
  const getPath = (o, p) => p.split(".").reduce((c, k) => (c && typeof c === "object" ? c[k] : undefined), o);
  function setPath(o, p, v) {
    const keys = p.split("."); let c = o;
    keys.slice(0, -1).forEach(k => { if (!c[k] || typeof c[k] !== "object") c[k] = {}; c = c[k]; });
    if (v === undefined || v === "") delete c[keys[keys.length - 1]]; else c[keys[keys.length - 1]] = v;
  }

  function settingsView() {
    const r = S.catalog.settings;
    const groups = new Map();
    for (const f of S.ed.schema) { if (!groups.has(f.group)) groups.set(f.group, []); groups.get(f.group).push(f); }
    const confirm = f => {
      r.placeholders = (r.placeholders || []).filter(p => p !== f.path);
      if (!r.placeholders.length) delete r.placeholders;
    };
    const set = (f, v, rerender = false) => {
      setPath(r, f.path, v); confirm(f); setTimeout(refreshMissing);
      if (f.path === "name") document.querySelector("header h1").textContent = v || S.ed.business.slug;
      changed(rerender);
    };
    const t = S.ed.template;
    const missingNote = el("div", { class: "note warn missing-note", role: "status" });
    const refreshMissing = () => {
      const miss = missingDetails();
      document.querySelectorAll(".field[data-path]").forEach(d => d.classList.toggle("missing", miss.some(f => f.path === d.dataset.path)));
      missingNote.hidden = !miss.length;
      missingNote.replaceChildren(el("strong", {}, "Still needed before you can publish: "),
        ...miss.flatMap((f, i) => [i ? ", " : "", el("a", { href: "#s-" + f.path.replace(/\./g, "-"), onclick: e => {
          e.preventDefault(); const x = document.getElementById("s-" + f.path.replace(/\./g, "-")); if (x) { x.scrollIntoView({ block: "center" }); x.focus(); } } },
          f.label.toLowerCase())]));
    };
    setTimeout(() => {
      refreshMissing();
      if (S.showMissing) {
        S.showMissing = false;
        const first = document.querySelector(".field.missing input, .field.missing textarea");
        if (first) { first.scrollIntoView({ block: "center" }); first.focus(); }
      }
    });
    return el("div", {}, missingNote, el("div", { class: "panel" },
      el("section", { class: "settings-group" }, el("h2", {}, "Business type"),
        el("div", {}, el("strong", {}, t.label)), el("span", { class: "sub" }, t.description)),
      [...groups].map(([group, fields]) => el("section", { class: "settings-group" },
      el("h2", {}, group),
      fields.map(f => {
        const id = "s-" + f.path.replace(/\./g, "-");
        let v = getPath(r, f.path);
        if (f.hide_when_empty && (v == null || v === "" || (Array.isArray(v) && !v.length))) return null;
        if (typeof v === "string" && v.includes("not available on this line yet")) v = "";  // old "unset" marker
        let input;
        if (f.type === "text") input = el("input", { id, type: "text", value: v ?? "", maxlength: f.max_length, placeholder: f.required ? null : "Not set",
          oninput: e => set(f, e.target.value) });
        else if (f.type === "textarea") input = el("textarea", { id, rows: 3, maxlength: f.max_length, placeholder: "Not set", oninput: e => set(f, e.target.value) }, v ?? "");
        else if (f.type === "integer") input = el("input", { id, type: "number", step: 1, min: f.min, max: f.max, value: v ?? "", style: "max-width:140px",
          oninput: e => { const n = parseInt(e.target.value, 10); set(f, isFinite(n) ? n : undefined); } });

          el("input", { id, type: "number", step: "0.001", min: (f.min || 0) * 100, max: (f.max || 1) * 100, style: "max-width:140px",

  // ---- read a menu from a link, photos or a PDF ----
  async function shrink(file) {  // big phone photos -> JPEG under 2000px, so uploads are quick
    if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
      return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
    } catch { return file; }  // the server says which formats it takes
  }

  async function openImport() {
    try { await flush(); } catch (e) { return toast("Couldn't save: " + e.message); }
    if (S.reading && S.reading.bid === S.rid) {  // a reading is under way: show its progress
      const { body } = sidePanel(`Reading your ${W().catalog}`, renderReadingPill);
      const box = el("div", { "aria-live": "polite" });
      body.append(box);
      S.reading.box = box; drawReading(); renderReadingPill();
      return;
    }
    const { body } = sidePanel(`Read your ${W().catalog}`, renderReadingPill);
    const files = el("input", { type: "file", multiple: true, accept: "image/*,application/pdf", id: "files" });
    const link = el("input", { type: "url", id: "menulink", placeholder: "https://yourwebsite.com/menu", autocomplete: "url", maxlength: 2000 });
    const hasItems = S.catalog.items.length > 0;
    const mode = el("select", { "aria-label": "What to do with what's there" },
      el("option", { value: "append" }, `Add to my ${W().catalog}`), el("option", { value: "replace" }, `Replace my ${W().catalog}`));
    const status = el("div", { "aria-live": "polite" });
    const lock = on => { go.disabled = link.disabled = files.disabled = mode.disabled = on; };
    const go = el("button", { class: "btn primary big", onclick: async () => {
      const url = link.value.trim();
      if (url && files.files.length) return toast("Use either the link or files, not both.");
      if (!url && !files.files.length) return toast("Paste a link, or choose at least one photo or PDF.");
      lock(true);
      status.replaceChildren(el("div", { class: "note info" }, url ? "Opening your page…" : "Uploading…"));
      try {
        const form = new FormData();
        if (url) form.append("url", url);
        for (const f of files.files) form.append("files", await shrink(f));
        const { job } = await upload(`/businesses/${S.rid}/import?mode=${mode.value}` + (S.revision ? `&revision=${S.revision}` : ""), form);
        followReading(S.rid, job, status, () => lock(false));
      } catch (e) {
        status.replaceChildren(el("p", { class: "err" }, e.message));
        lock(false);
      }
    } }, `Read my ${W().catalog}`);
    body.append(...[
      el("p", { class: "sub" }, `Paste the link to your ${W().catalog} on your website, or upload photos or a PDF of it. We'll list every ${W().item} with its price and choices. You review everything before it goes live.`),
      el("div", { class: "field" }, el("label", { for: "menulink" }, `Link to your ${W().catalog}`), link),
      el("div", { class: "or" }, "or"),
      el("div", { class: "field" }, el("label", { for: "files" }, "Photos or PDF (up to 10)"), files),
      hasItems ? el("div", { class: "field" }, el("span", { class: "lbl" }, `You already have ${S.catalog.items.length} ${W().items}`), mode) : null,
      el("p", { class: "sub" }, "Prices we can't read are marked “estimated” for you to check."),

  // ---- a menu reading in progress ----
  // S.reading = { bid, job, last, box, t0 }: polled until it ends, whether or not the panel
  // is open. With the panel closed, a pill in the corner shows progress and reopens it.
  // It's picked up again after a reload (loadEditor asks the server for a running job).
  const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  function drawReading() {
    const R = S.reading;
    if (!R || !R.box || !R.box.isConnected) return;
    R.box.replaceChildren(R.last ? importProgress(R.last, clock(R.last.elapsed ?? 0))
      : el("div", { class: "note info" }, `Reading your ${W().catalog}…`));
    const list = R.box.querySelector(".secs"); if (list) list.scrollTop = list.scrollHeight;
  }

  function renderReadingPill() {
    document.querySelectorAll(".readpill").forEach(n => n.remove());
    const R = S.reading;
    if (!R || R.bid !== S.rid || (R.box && R.box.isConnected)) return;
    const r = R.last || {};
    const what = r.stage === "fetching" ? "Opening your page…"
      : r.stage === "saving" ? "Saving…"
      : r.items ? `${r.current || "…"} · ${r.items} ${r.items === 1 ? W().item : W().items}` : "Starting…";
    document.body.append(el("button", { class: "readpill", type: "button", onclick: openImport,
      "aria-label": `Reading your ${W().catalog}: ${what}. Show progress.` },
      el("span", { class: "dotpulse", "aria-hidden": "true" }),
      el("span", {}, el("strong", {}, `Reading your ${W().catalog}`), el("span", { class: "muted" }, " · " + what))));
  }

  async function followReading(bid, job, box, onError) {
    if (S.reading && S.reading.job === job) return;  // already following it
    S.reading = { bid, job, last: null, box, t0: Date.now() };
    const R = S.reading;
    drawReading(); renderReadingPill();
    let out, err;
    for (;;) {
      let r = null;
      try { r = await api("GET", `/businesses/${bid}/import/${job}`); }
      catch (e) { if (e.status === 404 || e.status === 403) { err = e; break; } }  // otherwise a blip: try again
      if (r && r.state === "done") { out = r; break; }
      if (r && r.state === "error") { err = new Error(r.error); break; }
      if (r) { R.last = r; drawReading(); renderReadingPill(); }
      await new Promise(res => setTimeout(res, 1200));
    }
    const panelOpen = R.box && R.box.isConnected;
    S.reading = null; renderReadingPill();
    if (err) {
      if (panelOpen) { R.box.replaceChildren(el("p", { class: "err" }, err.message)); if (onError) onError(); }
      else toast(`Reading the ${W().catalog} didn't finish: ${err.message}`);
      return;
    }
    if (S.rid !== bid) return toast(`Finished reading the ${W().catalog} for another business.`);
    if (panelOpen) document.querySelectorAll(".side, .side-bg").forEach(n => n.remove());
    try { await flush(); } catch {}
    S.tab = panelOpen ? "catalog" : S.tab;
    await loadEditor();
    toast(`Added ${out.added} ${W().items}. Check prices, then publish.`);
    const notes = [
      out.rules ? `${out.rules} ${out.rules === 1 ? W().item : W().items} got ordering rules from your ${W().catalog} (like weekends only). They're marked "Check rules".` : "",
      out.questions ? `${out.questions} answer${out.questions === 1 ? "" : "s"} for Common questions drafted in Settings. Check them before publishing.` : "",
      out.left_out && out.left_out.length ? "Left out (specials and market-price items): " + out.left_out.join(", ") + "." : "",
      out.unreadable && out.unreadable.length ? "Couldn't read: " + out.unreadable.join(", ") + "." : ""].filter(Boolean);
    if (panelOpen && notes.length) ask({ title: "Worth a look", body: notes.join("\n\n"), cancel: null });
  }

  function importProgress(r, elapsed) {
    const n = r.items || 0;
    const head = r.stage === "fetching" ? "Opening your page…"
      : r.stage === "saving" ? `Saving ${n} ${W().items} to your ${W().catalog}…`
      : n === 0 ? `Reading your ${W().catalog}…`
      : null;
    const title = head ? el("strong", {}, head)
      : el("span", {}, "Reading ", el("strong", {}, r.current || "…"), ` · ${n} ${n === 1 ? W().item : W().items} so far`);
    const secs = r.sections || [];
    return el("div", { class: "readprog" },
      el("div", { class: "row between" }, title, el("span", { class: "mono muted" }, elapsed)),
      el("div", { class: "pbar", role: "progressbar", "aria-label": "Reading", "aria-busy": "true" }, el("span")),
      secs.length ? el("ol", { class: "secs", "aria-live": "polite" }, secs.map((sec, i) => {
        const now = i === secs.length - 1 && r.stage === "reading";
        return el("li", { class: now ? "now" : "" }, el("span", { class: "sectick", "aria-hidden": "true" }, now ? "" : "✓"),
          el("span", { class: "grow" }, sec.name), el("span", { class: "muted" }, String(sec.items)));
      })) : el("p", { class: "sub" }, n === 0 && r.stage === "reading"
        ? "Sections appear here as they're read. Big menus can take a few minutes; you can close this and keep working."
        : ""),
      r.last_item && r.stage === "reading" ? el("p", { class: "sub" }, "Just read: ", r.last_item) : null);
  }

  async function upload(path, form) {
    const r = await fetch(API + path, { method: "POST", body: form, headers: { "X-Manage": "1" }, credentials: "same-origin" });
    let data = null; try { data = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((data && data.detail) || `Upload failed (${r.status})`); e.status = r.status; throw e; }
    return data;
  }

  window.addEventListener("hashchange", () => { if (/invite=/.test(location.hash)) boot(); });
  boot();
})();
</script>
